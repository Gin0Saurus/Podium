// Short lessons: key ideas, one worked example revealed step by step, one thing to remember.
// tp matches a practice topic so each lesson can hand over to questions.
const LESSONS = [];
const LS = (id, tr, tp, lv, title, sum, ideas, exq, exs, tip) => LESSONS.push({ id, tr, tp, lv, title, sum, ideas, exq, exs, tip });
const LEVELS = ['', 'Start here', 'Core skills', 'Stretch'];

/* Intermediate */
LS('tac', 'imc', null, 1, 'How the paper works', 'Marking, timing and when to guess',
  [`25 questions in 60 minutes. They get harder as the paper goes on, and you are not expected to finish.`,
   `Q1–15 are worth 5 marks with no penalty. Never leave one blank.`,
   `Q16–20 are worth 6 marks and a wrong answer loses 1. Q21–25 are worth 6 and a wrong answer loses 2.`,
   `Bank the first 15 carefully before you spend time on the hard ones. A slip on Q3 costs as much as most of Q20.`,
   `Use the options: test them, estimate, and rule out the ones that cannot be right.`],
  `On Q23 you have ruled out three options and cannot decide between the last two. Should you guess?`,
  [`A right answer on Q21–25 gains 6 marks. A wrong answer loses 2.`,
   `With two options left, each is equally likely: half the time you gain 6, half the time you lose 2.`,
   `On average that is (6 − 2) ÷ 2 = +2 marks per guess.`,
   `So yes, guess. Compare a blind guess between all five: (6 − 2 − 2 − 2 − 2) ÷ 5 = −0.4, which loses marks on average.`],
  `On Q21–25, guess only when you have ruled out at least two options.`);
LS('div', 'imc', 'Number', 1, 'Divisibility and remainders', 'Spot multiples without dividing',
  [`3 and 9: add the digits. If the digit sum is a multiple of 3 (or 9), so is the number.`,
   `4: look at the last two digits. 8: look at the last three.`,
   `11: alternately add and subtract the digits. A result of 0 or a multiple of 11 means divisible by 11.`,
   `The remainder on dividing by 9 is the same as the remainder of the digit sum.`,
   `“Leaves remainder 1 when divided by 2, 3, 4…” means one more than a common multiple. Find the LCM and add 1.`],
  `What is the remainder when 7358 is divided by 9?`,
  [`Add the digits: 7 + 3 + 5 + 8 = 23.`,
   `23 is still big, so add its digits: 2 + 3 = 5.`,
   `The remainder on dividing by 9 matches the digit sum, so the remainder is 5.`,
   `Check: 9 × 817 = 7353, and 7358 − 7353 = 5.`],
  `Digit sums answer most questions about 3 and 9 in seconds.`);
LS('pct', 'imc', 'Ratio & percentages', 1, 'Percentages without the traps', 'Multipliers and working backwards',
  [`Turn every percentage change into a multiplier: up 15% is × 1.15, down 20% is × 0.8.`,
   `To undo a change, divide by the multiplier. Never add the percentage back on.`,
   `Two changes in a row: multiply the multipliers. Up 25% then down 20% is 1.25 × 0.8 = 1.`,
   `<i>a</i>% of <i>b</i> equals <i>b</i>% of <i>a</i>. So 36% of 25 is 25% of 36, which is 9.`],
  `After a 15% rise, a ticket costs £46. What did it cost before the rise?`,
  [`A 15% rise multiplies the old price by 1.15.`,
   `So old price × 1.15 = 46.`,
   `Divide: 46 ÷ 1.15 = 40.`,
   `The ticket cost £40. Check: 15% of 40 is 6, and 40 + 6 = 46.`],
  `The percentage is always of the original amount, so reverse a change by dividing.`);
LS('ang', 'imc', 'Geometry', 1, 'Angles and polygons', 'Exterior angles are the fast route',
  [`Angles in a triangle add to 180°. Angles in a quadrilateral add to 360°.`,
   `The exterior angles of any polygon add to 360°.`,
   `In a regular polygon with <i>n</i> sides, each exterior angle is 360° ÷ <i>n</i> and each interior angle is 180° minus that.`,
   `Look for isosceles triangles: equal sides mean equal base angles. Radii of a circle are always equal.`,
   `Diagrams are not drawn to scale. Never judge an angle by eye.`],
  `Each interior angle of a regular polygon is 150°. How many sides does it have?`,
  [`Find the exterior angle: 180° − 150° = 30°.`,
   `The exterior angles add up to 360°.`,
   `So the number of sides is 360 ÷ 30 = 12.`],
  `Regular polygon question? Go straight to the exterior angle.`);
LS('logic', 'imc', 'Logic & puzzles', 1, 'Logic puzzles', 'Try a case and hunt for a contradiction',
  [`Start with the clue that restricts the most.`,
   `For “who owns what” puzzles, write the facts as an ordered list or a small grid.`,
   `For truth-tellers and liars, assume one person tells the truth and follow the consequences. A contradiction kills that case.`,
   `For days and clocks, use remainders: days repeat every 7.`],
  `A says “B is lying.” B says “C is lying.” C says “A and B are both lying.” Who is telling the truth?`,
  [`Suppose C tells the truth. Then A and B are both lying.`,
   `If B is lying, then C is not lying. Fine so far.`,
   `If A is lying, then B is not lying. But we just said B is lying: contradiction. So C is lying.`,
   `Since C is lying, B’s statement is true, so B tells the truth.`,
   `A says B is lying, which is false, so A is lying. Only B tells the truth.`],
  `Assume, follow it through, and let contradictions do the work.`);
LS('fac', 'imc', 'Number', 2, 'Primes, factors and zeros', 'Prime factorise first',
  [`Write the number as a product of prime powers. Most factor questions fall apart after that.`,
   `Number of factors: add 1 to each power and multiply. 72 = 2³ × 3² has 4 × 3 = 12 factors.`,
   `Only square numbers have an odd number of factors.`,
   `Zeros at the end of <i>n</i>!: count the 5s. Divide <i>n</i> by 5, by 25, by 125, and add the whole-number parts.`,
   `HCF × LCM equals the product of the two numbers.`],
  `How many positive factors does 360 have?`,
  [`Factorise: 360 = 36 × 10 = 2³ × 3² × 5.`,
   `The powers are 3, 2 and 1.`,
   `Add 1 to each and multiply: 4 × 3 × 2 = 24.`,
   `So 360 has 24 factors.`],
  `Add one to each power, then multiply.`);
LS('last', 'imc', 'Number', 2, 'Last digits and big powers', 'You never need the whole number',
  [`The last digit of a sum or product depends only on the last digits.`,
   `Last digits of powers repeat in short cycles. For 2: 2, 4, 8, 6. For 3: 3, 9, 7, 1. For 7: 7, 9, 3, 1.`,
   `Every cycle has length 1, 2 or 4, so use the remainder of the power when divided by 4.`,
   `For big subtractions such as 2026² − 2025², use the difference of two squares.`],
  `What is the last digit of 3<sup>2027</sup>?`,
  [`The last digits of powers of 3 go 3, 9, 7, 1 and then repeat.`,
   `The cycle has length 4, so find the remainder when 2027 is divided by 4.`,
   `2024 is a multiple of 4, so the remainder is 3.`,
   `The third number in the cycle is 7. The last digit is 7.`],
  `Remainder of the power on dividing by 4, then read off the cycle.`);
LS('rate', 'imc', 'Ratio & percentages', 2, 'Ratio, speed and rates', 'Totals, parts and rates',
  [`For ratios, find the value of one part first.`,
   `Turn means into totals straight away: total = mean × how many.`,
   `Average speed is total distance ÷ total time. It is never the mean of the speeds.`,
   `When people or taps work together, add their rates (jobs per hour), not their times.`],
  `Ali can paint a fence in 6 hours. Bea can paint it in 3 hours. How long do they take working together?`,
  [`Ali paints 1/6 of the fence per hour.`,
   `Bea paints 1/3 of the fence per hour.`,
   `Together: 1/6 + 1/3 = 1/2 of the fence per hour.`,
   `So the whole fence takes 2 hours.`],
  `Add rates, not times.`);
LS('area', 'imc', 'Geometry', 2, 'Lengths, areas and circles', 'Triples, shaded regions and scale',
  [`Know the triples: 3-4-5, 5-12-13, 8-15-17, 7-24-25 and their multiples.`,
   `A square of side <i>s</i> has diagonal <i>s</i>√2. From the diagonal <i>d</i>, the area is ½<i>d</i>².`,
   `Shaded regions are almost always “big shape minus small shape”.`,
   `If lengths are multiplied by <i>k</i>, areas are multiplied by <i>k</i>² and volumes by <i>k</i>³.`,
   `Equilateral triangle of side <i>s</i>: area (√3 ÷ 4)<i>s</i>².`],
  `A square is drawn inside a circle of radius 5 with all four corners on the circle. What is the area of the square?`,
  [`The diagonal of the square is a diameter of the circle.`,
   `So the diagonal is 2 × 5 = 10.`,
   `The area of a square is half the diagonal squared.`,
   `Area = ½ × 10² = 50.`],
  `Find the length the two shapes share. It is usually a radius or a diagonal.`);
LS('alg', 'imc', 'Algebra', 2, 'Algebra shortcuts', 'Combine, do not solve',
  [`<i>a</i>² − <i>b</i>² = (<i>a</i> − <i>b</i>)(<i>a</i> + <i>b</i>). It appears on almost every paper.`,
   `If the question asks for <i>a</i> + <i>b</i> + <i>c</i>, try adding all the equations before solving anything.`,
   `For consecutive numbers with a known sum, the middle number is the mean.`,
   `<i>mn</i> + <i>m</i> + <i>n</i>: add 1 and factorise as (<i>m</i> + 1)(<i>n</i> + 1).`,
   `Read the last line again. If it asks for 5<i>x</i>, do not answer <i>x</i>.`],
  `Given that <i>a</i> − <i>b</i> = 5 and <i>a</i>² − <i>b</i>² = 65, what is the value of <i>a</i>?`,
  [`Factorise the second equation: (<i>a</i> − <i>b</i>)(<i>a</i> + <i>b</i>) = 65.`,
   `We know <i>a</i> − <i>b</i> = 5, so <i>a</i> + <i>b</i> = 65 ÷ 5 = 13.`,
   `Add the two equations: 2<i>a</i> = 18.`,
   `So <i>a</i> = 9.`],
  `See two squares subtracted? Factorise before anything else.`);
LS('count', 'imc', 'Counting & probability', 2, 'Counting without listing', 'Multiply the choices',
  [`If one choice has 3 options and the next has 4, there are 3 × 4 ways to make both.`,
   `<i>n</i> different things can be arranged in <i>n</i>! ways.`,
   `If some things are identical, divide by the factorial of each repeat. LEVEL: 5! ÷ (2! × 2!) = 30.`,
   `Choosing 3 from 9 when order does not matter: 9 × 8 × 7 ÷ (3 × 2 × 1) = 84.`,
   `Sometimes it is easier to count what you do not want and subtract.`],
  `How many three-digit numbers have three different digits?`,
  [`The first digit can be 1 to 9: that is 9 choices (it cannot be 0).`,
   `The second digit can be anything except the first: 9 choices, because 0 is now allowed.`,
   `The third digit must differ from both: 8 choices.`,
   `Multiply: 9 × 9 × 8 = 648.`],
  `Fill the most restricted position first.`);
LS('prob', 'imc', 'Counting & probability', 3, 'Probability', 'Favourable over total',
  [`With equally likely outcomes, probability = favourable outcomes ÷ total outcomes.`,
   `Two dice have 36 outcomes. List the pairs that work.`,
   `“And” for independent events: multiply. “Or” for events that cannot both happen: add.`,
   `“At least one” is 1 minus the probability of none.`,
   `Without replacement, the second fraction has one fewer on the bottom.`],
  `Two fair dice are rolled. What is the probability that at least one shows a six?`,
  [`Work out the opposite: no six at all.`,
   `Each die avoids a six with probability 5/6.`,
   `Both avoid it with probability 5/6 × 5/6 = 25/36.`,
   `So at least one six has probability 1 − 25/36 = 11/36.`],
  `For “at least one”, find “none” and subtract from 1.`);

/* Senior */
LS('quad', 'smc', 'Algebra', 2, 'Quadratics and their roots', 'Use the sum and product',
  [`For <i>x</i>² + <i>bx</i> + <i>c</i> = 0, the roots add to −<i>b</i> and multiply to <i>c</i>.`,
   `You rarely need the roots themselves. <i>p</i>² + <i>q</i>² = (<i>p</i> + <i>q</i>)² − 2<i>pq</i>.`,
   `A line is tangent to a curve when their intersection equation has a repeated root: discriminant zero.`,
   `Complete the square to find a minimum or maximum without calculus.`],

/* ───────── Question generators ─────────
   Each template is one idea from the papers, written as a recipe. The numbers,
   contexts and wording change every time, the answer is computed rather than
   typed, and the wrong options come from the slips students actually make.
   A generated question's id ("G.template.seed") rebuilds it exactly. */
const GEN = [];

const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
const rint = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const rpick = (r, arr) => arr[Math.floor(r() * arr.length)];
const rshuf = (r, a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const choose = (n, k) => { let x = 1; for (let i = 1; i <= k; i++) x = x * (n - k + i) / i; return Math.round(x); };
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const NUMW = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];
const pounds = p => (p % 100 === 0 ? `£${p / 100}` : `£${(p / 100).toFixed(2)}`);

/* Option helpers. An item is { k: sort key, t: text }. */
const Nm = (x, u = '') => ({ k: x, t: `${x < 0 ? '−' : ''}${Math.abs(x)}${u}` });
const Fr = (n, d) => { const g = gcd(n, d); n /= g; d /= g; const sg = n < 0 ? '−' : ''; return { k: n / d, t: d === 1 ? `${sg}${Math.abs(n)}` : `${sg}${Math.abs(n)}/${d}` }; };

  const seen = new Set([ans.t]), out = [ans];
  for (const c of cands) { if (out.length >= 5) break; if (!c || c.t === undefined || /NaN|undefined|Infinity/.test(c.t) || seen.has(c.t)) continue; seen.add(c.t); out.push(c); }
  for (let k = 1; out.length < 5 && k < 60; k++) for (const s of [1, -1]) {
    if (out.length >= 5) break;
    const c = fill ? fill(k * s) : (typeof ans.k === 'number' && Number.isInteger(ans.k) ? Nm(ans.k + k * s, ans.t.replace(/^[−-]?[\d.]+/, '')) : null);
    if (c && !seen.has(c.t) && !(typeof c.k === 'number' && c.k <= 0 && ans.k > 0)) { seen.add(c.t); out.push(c); }
  }
  const arr = sort ? out.slice().sort((x, y) => x.k - y.k) : rshuf(r, out);

const FR = [['1/8', '0.125'], ['3/8', '0.375'], ['5/8', '0.625'], ['7/8', '0.875'], ['1/6', '0.1666…'], ['1/7', '0.1428…'], ['1/9', '0.111…'], ['1/11', '0.0909…'], ['1/12', '0.0833…'], ['3/20', '0.15'], ['7/20', '0.35'], ['1/16', '0.0625']];

/* ───────── Duels by code (no server needed) ───────── */
const enc = o => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/=+$/, '');

function duelQs(tr, seed) { // both players rebuild the same five from the seed
  const used = new Set(), out = []; [2, 2, 3, 3, 3].forEach((d, i) => { const q = genOne(tr, d, { used, salt: `duel${seed}${i}` }); if (q) { out.push(q); used.add(q.tpl); } });
  if (out.length === 5) return out;
  const pool = QUESTIONS.filter(q => q.tr === tr && q.o && q.d >= 2 && q.d <= 3).sort((a, b) => (a.id < b.id ? -1 : 1)); return shuffle(pool, seeded('duel' + seed)).slice(0, 5).sort((a, b) => a.d - b.d);
}
function startDuel(tr, seed, rival) { const qs = duelQs(tr, seed); if (qs.length < 5) { toast('Duels need the Intermediate or Senior course'); return; } DUEL = { tr, seed, qs, i: 0, ans: [], rival: rival || null, done: false }; go('duel'); }

function vDuel() {

  track: d => { S.track = d.id; HOMECH = false; save(); render(); },
  quick: () => { if (needSet()) return; startRun(pickLevel(S.track), { title: TR[S.track].short, level: true, metered: true, again: () => ACT.quick() }); },
  topic: d => { if (needSet()) return; startRun(pickLevel(S.track, d.tp), { title: `${TR[S.track].short} · ${d.tp}`, metered: true, again: () => ACT.topic(d) }); },
  bank: () => startRun(shuffle(bankDue()).slice(0, 8), { title: 'Mistake Bank', bank: true }),
  bankall: () => startRun(shuffle(bankList()).slice(0, 8), { title: 'Mistake Bank', bank: true }),
  duelmenu: () => sheet(`<h2>Duel a friend</h2><p class="muted">Five questions marked like the paper: +5 right, −2 wrong, 0 blank. Play, send your code, and your friend plays the same five.</p>
    <button class="btn primary wide" data-act="duel">Start a new duel</button>
    <label class="field" for="duel-in">Got a code from a friend?<input id="duel-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste the duel code"></label>
    <button class="btn wide" data-act="duelcode">Play their five</button>`),
  duel: () => startDuel(BANDS[S.track] ? S.track : 'imc', Math.random().toString(36).slice(2, 8)),
  duelcode: () => { const r = dec(document.getElementById('duel-in').value || ''); if (r && r.s) closeSheet(true); if (!r || !r.s || !BANDS[r.t] || typeof r.p !== 'number') { toast('That code is not valid. Copy the whole code and try again.'); return; } startDuel(r.t, String(r.s), { p: r.p, n: String(r.n || '').slice(0, 24) }); },
  duelans: d => {
    const D = DUEL, i = +d.i; D.ans[D.i] = i < 0 ? null : i; const q = D.qs[D.i]; if (i >= 0) record(q, i === q.a);
    if (++D.i >= 5) { D.done = true; S.duels++; const mine = duelScore(D); addXP(10 + 3 * D.qs.filter((x, k) => D.ans[k] === x.a).length + (D.rival && mine > D.rival.p ? 10 : 0)); if (D.rival && mine > D.rival.p) confetti(); checkBadges(); }
    save(); render(); window.scrollTo(0, 0);
  },
  reportcopy: () => { const out = document.getElementById('report-out'); if (out) { out.focus(); out.select(); } try { navigator.clipboard.writeText(out.value).then(() => toast('Report copied', 'good'), () => toast('Select the text and copy it')); } catch (e) { toast('Select the text and copy it'); } },
  duelcopy: () => { const out = document.getElementById('duel-out'); if (out) { out.focus(); out.select(); } try { navigator.clipboard.writeText(out.value).then(() => toast('Duel code copied', 'good'), () => toast('Select the code and copy it')); } catch (e) { toast('Select the code and copy it'); } },
  daily: () => startRun([dailyQ()], { title: 'Daily challenge', mult: 2, daily: true }),
  ans: d => { if (RUN.ok !== null) return; RUN.pick = +d.i; sfx('tap'); buzz(6); render(); },
  check: () => {
    if (RUN.ok !== null) return; const q = RUN.qs[RUN.i];
    if (kind(q) === 'numeric') { checkNumeric(); return; }
    if (RUN.pick === null) return; const i = RUN.pick, ok = i === q.a; RUN.sel = i;
    RUN.combo = ok ? RUN.combo + 1 : 0;
    finishAnswer(q, ok, ok ? Math.round(baseXP(q) * RUN.mult * (RUN.hint ? 0.7 : 1)) + (RUN.combo >= 5 ? 5 : RUN.combo >= 3 ? 2 : 0) : 0);
  },
  reveal: () => { RUN.reveal = true; render(); },
  hint: () => { RUN.hint = true; render(); },
  step: () => { RUN.step++; render(); },
  ltab: d => { LTAB = d.id; render(); },
  lesson: d => { const l = LESSONS.find(x => x.id === d.id); if (!l) return; if (!lessonFree(l) && needPlus('lesson')) return; LES = { l, page: 0, step: 0 }; go('lesson'); },
  lnext: () => { LES.page++; render(); window.scrollTo(0, 0); },
  lback: () => { if (LES.page > 0) LES.page--; MOTION_DIR = -1; render(); window.scrollTo(0, 0); },
  golearn: () => { LTAB = 'lessons'; setRoute('learn'); },
  gofacts: () => { LTAB = 'facts'; setRoute('learn'); },
  homech: () => sheet(`<h2>Choose a course</h2><div class="pickgrid">${TRACKS.map(t => `<button class="pick ${t.id === S.track ? 'on' : ''}" data-act="track" data-id="${t.id}"><b>${t.name}</b><small>${t.blurb}</small></button>`).join('')}</div>`),
  sheetclose: () => closeSheet(),
  ovclose: () => closeOverlay(),
  mute: () => { S.mute = !S.mute; save(); render(); if (!S.mute) { sfx('right'); buzz(15); } },
  hard: () => { if (needPlus('hard')) return; const ts = tiersOf(S.track), top = ts[ts.length - 1], nx = Math.max(ts[0], top - 1); startRun(freshSet(S.track, [nx, nx, nx, top, top, top], { figShare: 0.34 }), { title: TR[S.track].short + ' · hard', again: () => ACT.hard() }); },
  lstep: () => { LES.step++; render(); },
  lfinish: () => { lessonDone(LES.l); leave(); },
  lpractise: () => { const l = LES.l; lessonDone(l); S.track = l.tr; if (needSet()) return; startRun(pick(l.tr, l.tp, 6), { title: TR[l.tr].short, metered: true, again: () => ACT.topic({ tp: l.tp }) }); },
  goal: d => { S.goal = +d.v; save(); render(); },
  target: d => { S.target = d.v; save(); render(); },
  tier: d => { if (needSet()) return; const dd = +d.d; startRun(freshSet(S.track, [dd, dd, dd, dd, dd, dd], { figShare: 0.34 }), { title: `${TR[S.track].short} · ${TIER_NAME[S.track][dd]} level`, metered: true, again: () => ACT.tier(d) }); },
  begin: () => { S.onboarded = true; save(); render(); window.scrollTo(0, 0); },
  self: d => { const q = RUN.qs[RUN.i], v = +d.v; RUN.sel = v; finishAnswer(q, v === 2, [2, 8, 15][v]); },
  next: () => {
    if (RUN.i + 1 < RUN.qs.length) { RUN.i++; RUN.sel = null; RUN.ok = null; RUN.gain = 0; RUN.reveal = false; RUN.step = 1; RUN.hint = false; RUN.pick = null; RUN.t0 = Date.now(); render(); window.scrollTo(0, 0); return; }
    RUN.done = true; sfx('done'); buzz(20);
    if (RUN.metered) useSet();
    if (RUN.bank || RUN.daily) plan().extra = 1; else if (RUN.qs.length >= 5) plan().set = 1;
    if (RUN.level) { RUN.move = levelAfter(S.track, RUN.correct, RUN.qs.length); if (RUN.move > 0) confetti(); }
    RUN.avg = RUN.times.length ? Math.round(RUN.times.reduce((a, b) => a + b, 0) / RUN.times.length / 1000) : 0;
    const P1 = predict(S.track); RUN.pred1 = P1 && P1.n >= 10 ? P1.score : null;
    if (RUN.daily && !S.daily[dayKey() + S.track]) { S.daily[dayKey() + S.track] = 1; if (S.qd.last !== dayKey()) { S.qd.n = S.qd.last === dayShift(-1) ? S.qd.n + 1 : 1; S.qd.last = dayKey(); } }
    if (RUN.correct === RUN.qs.length && RUN.qs.length >= 4) { RUN.bonus = 10; RUN.xp += 10; S.perfect++; addXP(10); confetti(); }
    planCheck(); checkBadges(); save(); render(); window.scrollTo(0, 0);
  },
  again: () => { const f = RUN.again; f && f(); },
  quit: () => { if (MODE === 'mockres') MOCK = null; leave(); },
  mock: d => { const m = MOCKS.find(x => x.id === d.id); if (m && !mockFree(m) && needPlus('mock')) return; startMock(d.id); },
  resume: () => { if (Date.now() >= MOCK.end) { finishMock(); return; } go('mock'); startMockTimer(); },
  mleave: () => { clearInterval(tickId); MOCK.leave = false; MODE = null; render(); window.scrollTo(0, 0); toast('Paper kept. The clock is still running.'); },
  mans: d => { sfx('tap'); buzz(8); const i = +d.i; MOCK.ans[MOCK.i] = MOCK.ans[MOCK.i] === i ? null : i; saveMock(); render(); },
  mflag: () => { MOCK.flag[MOCK.i] = !MOCK.flag[MOCK.i]; saveMock(); render(); },
  mgo: d => { const i = +d.i; if (i >= 0 && i < MOCK.qs.length) { MOCK.i = i; MOCK.confirm = false; saveMock(); render(); window.scrollTo(0, 0); } },
  msubmit: () => { const b = MOCK.ans.filter(a => a === null).length; sheet(`<h2>Hand in your paper?</h2><p class="muted">${b ? `${b} question${b === 1 ? ' is' : 's are'} blank.` : 'Every question has an answer.'} You cannot change answers afterwards.</p><button class="btn primary wide" data-act="mfinish">Hand in</button><button class="btn wide" data-act="mcancel">Keep working</button>`); },
  mcancel: () => closeSheet(),
  mask: () => sheet(`<h2>Leave this paper?</h2><p class="muted">Save it to carry on later (the clock keeps running), or quit and throw it away.</p><button class="btn primary wide" data-act="mcancel">Keep working</button><button class="btn wide" data-act="mleave">Save and leave</button><button class="btn danger wide" data-act="mquit">Quit paper</button>`),
  mquit: () => { clearInterval(tickId); MOCK = null; saveMock(); MODE = null; render(); window.scrollTo(0, 0); toast('Paper discarded'); },
  mfinish: () => { sfx('done'); finishMock(); },
  deck: d => startDeck(d.id),
  flip: () => { DECK.flip = !DECK.flip; DECK.justFlip = true; sfx('flip'); render(); },
  card: d => {
    const c = DECK.cs[DECK.i], v = +d.v, old = S.cards[c.id] || 0;
    if (v) { S.cards[c.id] = Math.min(3, old + 1); DECK.got++; if (old < 3) addXP(2); const qu = quest(); qu.cards++; if (qu.cards >= 5) qu.learn = 1; questCheck(); } else S.cards[c.id] = 0;
    DECK.i++; DECK.flip = false; if (DECK.i >= DECK.cs.length) DECK.done = true;
    checkBadges(); save(); render();
  },
  sprint: () => startSprint(),
  sp: d => {
    if (SPRINT.done) return; const ok = d.v === SPRINT.cur.a;
    if (ok) { SPRINT.score++; sfx('tap'); buzz(8); } else { SPRINT.wrong++; SPRINT.end -= 2000; sfx('wrong'); buzz([25, 40, 25]); }
    SPRINT.flash = ok ? 'flash-good' : 'flash-bad'; SPRINT.cur = genSprint(); render();
  },
  sheet: () => { SHEET = { tr: S.track === 'smc' ? 'smc' : 'imc', label: '', m: Array(25).fill('b') }; go('sheet'); },
  sheettr: d => { SHEET.tr = d.id; render(); },
  sheetq: d => { const i = +d.i; SHEET.m[i] = ({ b: 'c', c: 'w', w: 'b' })[SHEET.m[i]]; render(); },
  sheetsave: () => {
    const H = SHEET, r = scoreMock(H.tr, H.m);
    if (r.b === 25) { toast('Mark at least one question first'); return; }
    S.mocks.push({ name: `Real ${H.tr === 'imc' ? 'Intermediate' : 'Senior'} paper${H.label ? ' ' + H.label.trim() : ''}`, tr: H.tr, date: dayKey(), score: r.score, max: r.max, c: r.c, w: r.w, b: r.b, band: band(H.tr, r.score, r.max) });
    if (S.mocks.length > 40) S.mocks.shift();
    addXP(30); checkBadges(); save(); SHEET = null; setRoute('mocks'); toast('Result saved. +30 XP', 'good');
  },
  backup: () => {
    BACKUP = true; render();
    const out = document.getElementById('backup-out'); if (out) { out.focus(); out.select(); }
    try { navigator.clipboard.writeText(encodeState()).then(() => toast('Backup code copied', 'good'), () => toast('Select the code and copy it')); } catch (e) { toast('Select the code and copy it'); }
  },
  restore: () => {
    const raw = (document.getElementById('restore-in').value || '').replace(/\s+/g, ''); let r = null;
    try { r = JSON.parse(decodeURIComponent(escape(atob(raw)))); } catch (e) { r = null; }
    if (!r || r.v !== 1 || typeof r.xp !== 'number') { toast('That code is not valid. Copy the whole code and try again.'); return; }
    S = Object.assign(blank(), r); bankInit(); BACKUP = false; save(); render(); toast('Progress restored', 'good');
  },
  reset: () => {
    if (!CONFIRM) { CONFIRM = true; render(); return; }
    CONFIRM = false; S = blank(); bankInit(); save(); toast('Progress erased'); render();
  },
};
document.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#"]');
  if (link) { e.preventDefault(); setRoute(link.getAttribute('href').slice(1)); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.dataset.act !== 'reset') CONFIRM = false;
  if (!['backup', 'restore'].includes(b.dataset.act)) BACKUP = false;
  if (b.closest('.sheet') && b.dataset.act !== 'sheetclose' && b.dataset.act !== 'duelcode') closeSheet();
  const f = ACT[b.dataset.act]; if (!f) return;
  try { f(b.dataset, b); } catch (err) { toast('Something went wrong. Try that again.'); try { console.error(err); } catch (e2) { /* ignore */ } }
});
function checkNumeric() {
  if (!RUN || RUN.ok !== null) return;
  const raw = document.getElementById('numin').value.trim(); if (!/^\d+$/.test(raw)) { toast('Type a whole number'); return; }
  const q = RUN.qs[RUN.i], v = parseInt(raw, 10), ok = v === q.a; RUN.sel = v; RUN.combo = ok ? RUN.combo + 1 : 0;
  finishAnswer(q, ok, ok ? baseXP(q) + 3 : 0);
}
document.addEventListener('touchstart', () => {}, { passive: true });
document.addEventListener('submit', e => { e.preventDefault(); if (e.target.dataset.form === 'num') checkNumeric(); });
document.addEventListener('input', e => {
  if (e.target.id === 'sheet-label' && SHEET) SHEET.label = e.target.value;
  if (e.target.id === 'set-name') S.name = e.target.value.trim().slice(0, 24);
  if (e.target.id === 'facts-q') { FACTQ = e.target.value; const out = document.getElementById('facts-out'); if (out) out.innerHTML = factsHtml(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'set-exam') { S.exam = e.target.value; save(); toast(S.exam ? 'Paper date saved' : 'Paper date cleared'); }
  if (e.target.id === 'set-name') { S.name = e.target.value.trim().slice(0, 24); save(); const me = document.getElementById('me-btn'); if (me) me.textContent = (S.name || cloudName || '?').charAt(0).toUpperCase(); }
  if (e.target.id === 'set-target') { S.target = e.target.value; save(); toast('Target saved'); }
  if (e.target.id === 'set-goal') { S.goal = +e.target.value; save(); render(); }
});

/* ───────── Optional account sync ───────── */
let cloudDoc = null, cloudOn = false, cloudBusy = false, cloudDirty = false, cloudTimer = 0;
async function cloudInit() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    cloudDoc = db.doc('data/users/' + id + '/progress');
    const snap = await cloudDoc.get(); let remote = null;
    if (snap.exists) { try { remote = JSON.parse(snap.data().json); } catch (e) { remote = null; } }
    cloudOn = true;
    try { const ps = await user.profiles([id]); cloudName = (ps && ps[id] && ps[id].name) || ''; } catch (e) { cloudName = ''; }
    if (remote && remote.v === 1 && (remote.updated || 0) > (S.updated || 0)) { S = Object.assign(blank(), remote); bankInit(); persistLocal(); if (!MODE) render(); }
    else if (S.updated && (!remote || (remote.updated || 0) < S.updated)) cloudPush();
    if (!MODE) render();
  } catch (e) { cloudDoc = null; cloudOn = false; }
}
function cloudPush() { if (!cloudDoc) return; cloudDirty = true; clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudFlush, 2500); }
async function cloudFlush() {
  if (cloudBusy || !cloudDirty || !cloudDoc) return;
  cloudBusy = true; cloudDirty = false;
  try { await cloudDoc.set({ json: JSON.stringify(S), updated: S.updated }); }
  catch (e) { if (e && e.code !== 'unavailable') { cloudDoc = null; cloudOn = false; } }
  cloudBusy = false; if (cloudDirty) cloudPush();
}

if (typeof document !== 'undefined' && app) { bankInit(); loadMock(); render(); splash(); cloudInit(); plusInit(); }


</script>
<script>
window.OFFLINE_CAPABLE = 'serviceWorker' in navigator && /^https?:$/.test(location.protocol);
if (window.OFFLINE_CAPABLE) {
  navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function () {
    return caches.match('./').then(function (hit) {
      if (!hit) return;
      window.OFFLINE_READY = true;
      var first = false; try { first = !localStorage.getItem('podium.offline'); localStorage.setItem('podium.offline', '1'); } catch (e) {}
      if (first) toast('Ready to use offline', 'good');
      if (!MODE && route() === 'account') render();
    });
  }).catch(function () {});
}
</script>
