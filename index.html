/* Layout idea: one calm column, answer-sheet lozenges as the signature control, medal colours only for rewards. */
:root{
  --bg:#edf0f5;--surface:#ffffff;--surface2:#f5f7fa;--ink:#101828;--muted:#566175;--line:#d7dce6;
  --accent:#2446f5;--accent-ink:#ffffff;--accent-soft:#e3e8ff;
  --good:#0f7a57;--good-soft:#dbf2e8;--bad:#c2362c;--bad-soft:#fbe4e1;--gold:#b98200;--gold-soft:#fff2cc;--flame:#e8590c;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:14px;--shadow:0 1px 2px rgba(16,24,40,.06),0 6px 20px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1019;--surface:#141b29;--surface2:#1a2233;--ink:#edf1f8;--muted:#9aa6ba;--line:#283247;
  --accent:#8799ff;--accent-ink:#0b1019;--accent-soft:#1e2852;
  --good:#4fd1a1;--good-soft:#11372c;--bad:#ff8a7f;--bad-soft:#45201d;--gold:#ffc940;--gold-soft:#3d3110;--flame:#ff8a3d;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1019;--surface:#141b29;--surface2:#1a2233;--ink:#edf1f8;--muted:#9aa6ba;--line:#283247;
  --accent:#8799ff;--accent-ink:#0b1019;--accent-soft:#1e2852;
  --good:#4fd1a1;--good-soft:#11372c;--bad:#ff8a7f;--bad-soft:#45201d;--gold:#ffc940;--gold-soft:#3d3110;--flame:#ff8a3d;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-bottom:84px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.7rem;line-height:1.15;font-weight:700}
h2{font-size:1.15rem;line-height:1.25;font-weight:650}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.fill{fill:currentColor;stroke:none}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:.85rem;color:var(--muted)}
.empty{color:var(--muted);padding:18px;border:1px dashed var(--line);border-radius:var(--r)}

.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:8px;font:700 1.2rem var(--display);color:var(--ink);text-decoration:none;margin-right:auto}
.logo svg{width:26px;height:26px;stroke:none}
.stat{display:flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.flame svg{color:var(--flame)}.stat.bolt svg{color:var(--gold)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 6px 10px}
nav a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:600}
nav a[aria-current="page"]{color:var(--accent)}
body.focus nav{display:none}body.focus{padding-bottom:24px}
@media (min-width:820px){
  body{padding-bottom:32px}
  nav{position:static;border:0;background:none;padding:0;gap:4px;justify-content:flex-start;flex:1}
  nav a{flex:none;flex-direction:row;gap:6px;padding:8px 12px;font-size:.9rem;max-width:none}
  .logo{margin-right:8px}
  body.focus nav{display:flex;visibility:hidden}
}
main{max-width:860px;margin:0 auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.page-head{display:flex;flex-direction:column;gap:4px}
.section{font-size:.95rem;margin-top:8px;color:var(--muted);font-family:var(--body);font-weight:650}

.row{display:flex;align-items:center}.between{justify-content:space-between;gap:12px}.gap{gap:10px}.wrap{flex-wrap:wrap}.centerrow{justify-content:center}
.card,.hero,.qcard,.tile,.deck,.rowbtn,.rowstat,.badge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card{padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.card>.bar,.card>.row,.card>dl,.card>.heat{align-self:stretch}
.card.done{opacity:.7}.card.accent{border-color:var(--accent)}
.hero{padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);border-top:4px solid var(--accent)}
.hero-top{display:flex;justify-content:space-between;gap:10px}
.cards2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font:700 1.6rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile b small{font-size:.9rem;color:var(--muted);font-weight:600}
.tile span{font-size:.8rem;color:var(--muted)}
.tile-ic{color:var(--accent)}.tile-ic.flame{color:var(--flame)}.tile-ic.bolt{color:var(--gold)}
.tile .bar{margin-top:6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;text-decoration:none;color:var(--ink);transition:transform .08s,background .15s}
.btn:hover{background:var(--surface2)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}.btn.primary:active{box-shadow:none;transform:translateY(3px)}
.btn.wide{width:100%}.btn.small{padding:7px 12px;font-size:.88rem;border-radius:10px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:650;text-decoration:underline}
.icon{background:none;border:0;padding:6px;border-radius:8px;color:var(--muted);display:flex}
.pill{font-size:.78rem;font-weight:650;padding:3px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 6px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:.9rem;color:var(--muted)}
.chip[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.bar{display:block;height:6px;border-radius:99px;background:var(--line);overflow:hidden;width:100%}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.bar.big{height:10px}.bar.warn i{background:var(--bad)}
.dots{display:inline-flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}

.list{display:flex;flex-direction:column;gap:8px}
.rowbtn,.rowstat{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;width:100%}
.rowbtn:hover{border-color:var(--accent)}
.rowbtn-main{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.rowbtn-main small{color:var(--muted);font-size:.84rem}
.rowbtn-go{color:var(--accent);display:flex}
.score{font:700 1.3rem var(--display);font-variant-numeric:tabular-nums}.score small{font-size:.8rem;color:var(--muted)}

.run{display:flex;flex-direction:column;gap:14px;max-width:680px;margin:0 auto;width:100%}
.run-top{display:flex;align-items:center;gap:12px}
.run-top.mock{justify-content:space-between}
.count{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.timer{font:700 1.3rem var(--display);font-variant-numeric:tabular-nums;padding:4px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qcard{padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.qcard.center{align-items:center;text-align:center;padding:32px 20px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);font-weight:600}
.stem{font-size:1.12rem;line-height:1.5;max-width:62ch}
.stem sup,.opt sup,.fb sup{font-size:.7em}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.two{display:grid;grid-template-columns:1fr 1fr;width:100%}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-size:1.02rem;transition:border-color .12s,background .12s}
.opt.mid{justify-content:center;font:650 1.15rem var(--display);padding:16px}
.opt:not(:disabled):hover{border-color:var(--accent);background:var(--accent-soft)}
/* The lozenge mirrors the pencil-in boxes on the real answer sheet */
.loz{flex:none;width:34px;height:22px;border:1.5px solid var(--muted);border-radius:6px;display:grid;place-items:center;font:700 .78rem var(--body);color:var(--muted)}
.opt.picked{border-color:var(--ink);background:var(--surface2)}
.opt.picked .loz{background:repeating-linear-gradient(115deg,var(--ink) 0 2px,color-mix(in srgb,var(--ink) 78%,transparent) 2px 4px);color:var(--bg);border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}.opt.right .loz{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .loz{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}.opt:disabled{cursor:default}
.numform{display:flex;flex-direction:column;gap:8px}.numform label{font-size:.88rem;color:var(--muted)}
.numform input{width:130px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:700 1.2rem var(--display)}
.fb{padding:18px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:12px}
.fb.good{background:var(--good-soft);border-color:var(--good)}.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-head{display:flex;align-items:center;gap:8px}.fb-head b{flex:1}
.fb.good .fb-ic{color:var(--good)}.fb.bad .fb-ic{color:var(--bad)}.fb-ic{display:flex}
.xp{font-weight:700;color:var(--gold);background:var(--gold-soft);padding:2px 10px;border-radius:99px;font-size:.85rem;white-space:nowrap}
.bigscore{font:800 4rem/1 var(--display);font-variant-numeric:tabular-nums}.bigscore small{font-size:1.5rem;color:var(--muted)}
.sprintq{font:700 2.2rem var(--display)}
.flash-good{animation:fg .35s}.flash-bad{animation:fbad .35s}
@keyframes fg{from{background:var(--good-soft)}}@keyframes fbad{from{background:var(--bad-soft)}}
@keyframes rise{from{transform:translateY(8px);opacity:.4}}
.flagbtn{display:inline-flex;align-items:center;gap:4px;background:none;border:1.5px solid var(--line);border-radius:8px;padding:4px 10px;font-size:.82rem;font-weight:650;color:var(--muted)}
.flagbtn svg{width:15px;height:15px}.flagbtn.on{color:var(--flame);border-color:var(--flame)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.qgrid button{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:650;font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.qgrid .ans{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qgrid .flag{box-shadow:inset 0 -4px 0 var(--flame)}
.qgrid .cur{outline:2.5px solid var(--accent);outline-offset:1px}

.flash{min-height:260px;padding:26px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.flash.flipped{background:var(--accent-soft);border-color:var(--accent)}
.flash-t{font-size:1.2rem;line-height:1.45;max-width:46ch}
.deck{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.deck>.row.gap{align-items:flex-start;flex-wrap:wrap}
.readlist{flex:1 1 100%;order:3}.readlist summary{list-style:none;display:inline-flex}.readlist summary::-webkit-details-marker{display:none}
.deck>.row.gap{position:relative}
.readlist[open] summary{background:var(--surface2)}
.readlist ul{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.readlist li{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:3px solid var(--line)}
.readlist li span{color:var(--muted);font-size:.94rem}
.guide{margin:0;display:flex;flex-direction:column}
.guide div{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.guide dt{font-weight:650;font-size:.88rem;color:var(--muted)}.guide dd{margin:0}
@media (max-width:440px){.guide div{grid-template-columns:1fr;gap:2px}.grid3{gap:6px}.tile{padding:10px}.tile b{font-size:1.3rem}}

.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:340px}
.heat i{aspect-ratio:1;border-radius:6px;background:var(--line)}
.heat .h1{background:color-mix(in srgb,var(--accent) 35%,var(--line))}.heat .h2{background:color-mix(in srgb,var(--accent) 65%,var(--line))}.heat .h3{background:var(--accent)}
.fold{padding:0;gap:0}.fold summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;flex-direction:column;gap:8px;align-self:stretch}
.fold summary::-webkit-details-marker{display:none}
.fold summary span{display:flex;justify-content:space-between;gap:10px}.fold summary small{color:var(--muted)}
.topics{align-self:stretch;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.topicrow{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr 70px;gap:10px;align-items:center;font-size:.9rem}
.topicrow .num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.82rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{padding:14px;display:flex;flex-direction:column;gap:4px;color:var(--muted)}
.badge small{font-size:.8rem}.badge .medal{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1.5px dashed var(--line)}
.badge.got{color:var(--ink);border-color:var(--gold)}.badge.got .medal{background:var(--gold-soft);color:var(--gold);border:1.5px solid var(--gold)}
.settings label{display:flex;flex-direction:column;gap:4px;font-weight:650;font-size:.9rem}
.settings input,.settings select{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);min-width:200px}
.review{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.review summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px}
.review summary::-webkit-details-marker{display:none}
.review .num{width:26px;font-weight:700;font-variant-numeric:tabular-nums}.rv-t{flex:1;color:var(--muted);font-size:.9rem}
.rv-body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
#toasts{position:fixed;bottom:92px;left:0;right:0;z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:650;font-size:.92rem;box-shadow:var(--shadow);animation:rise .25s;transition:opacity .4s}
.toast.gold{background:var(--gold);color:#1a1300}.toast.good{background:var(--good);color:var(--surface)}.toast.out{opacity:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

svg.fig{width:100%;max-width:270px;height:auto;align-self:center;stroke-width:1.6;overflow:visible}
.fig .soft{fill:var(--accent-soft)}.fig .paper{fill:var(--surface)}.fig .dash{stroke-dasharray:5 4}.fig .dot{fill:currentColor}
.fig text{fill:currentColor;stroke:none;font:600 13px var(--body)}
.review .fig{align-self:flex-start}
.me{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg);font:700 .9rem var(--display);text-decoration:none}
.field{display:flex;flex-direction:column;gap:4px;font-weight:650;font-size:.9rem;align-self:stretch}
.field input,.field textarea,.settings input{padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:400}
.field textarea{font:400 .8rem ui-monospace,Menlo,Consolas,monospace;word-break:break-all;resize:vertical;width:100%}
.qgrid.sheet .c{background:var(--good);border-color:var(--good);color:var(--surface)}
.qgrid.sheet .w{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.bigscore.small{font-size:2.4rem}
.run-top h2{flex:1}
a.btn{text-decoration:none}

/* v3: lessons, path, quests, steps */
.hero{border-top:0;background:linear-gradient(160deg,var(--surface) 55%,var(--accent-soft));gap:14px}
.hero-row{display:flex;gap:16px;align-items:center}
.ring{position:relative;flex:none;width:76px;height:76px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;stroke-width:6}
.ring-bg{stroke:var(--line)}.ring-fg{stroke:var(--accent);transition:stroke-dashoffset .6s}
.ring b{font:800 1.7rem var(--display)}
.hero-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.hero-stats{display:flex;gap:16px;flex-wrap:wrap}
.hs{display:inline-flex;align-items:center;gap:5px;font-size:.92rem;color:var(--muted)}.hs b{color:var(--ink);font-variant-numeric:tabular-nums}
.hs.flame svg{color:var(--flame)}.hs.bolt svg{color:var(--gold)}
.card.next{border:1.5px solid var(--accent);box-shadow:var(--shadow)}
.quests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;align-self:stretch}
.quests li{display:flex;align-items:center;gap:12px}
.qtick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--surface)}
.qtick svg{width:16px;height:16px;stroke-width:3}
.quests li.done .qtick{background:var(--good);border-color:var(--good)}
.quests li.done b{color:var(--muted);text-decoration:line-through}
.quests li.done .xp{opacity:.5}
.path{list-style:none;margin:0;padding:0;align-self:stretch;display:flex;flex-direction:column}
.path li{position:relative}
.path li:not(:last-child)::after{content:"";position:absolute;left:19px;top:46px;bottom:-6px;width:2px;background:var(--line)}
.path li.done:not(:last-child)::after{background:var(--good)}
.path button{display:flex;align-items:center;gap:14px;width:100%;padding:8px 0;background:none;border:0;text-align:left}
.node{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--line);font:700 .95rem var(--display);color:var(--muted);position:relative;z-index:1}
.node svg{width:18px;height:18px}
.path li.done .node,.node.done{background:var(--good);border-color:var(--good);color:var(--surface)}
.path li.cur .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px var(--accent-soft)}
.path-t{display:flex;flex-direction:column;min-width:0}.path-t small{color:var(--muted);font-size:.84rem}
.path li.done .path-t b{color:var(--muted)}
.path button:hover b{color:var(--accent)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border:0;border-radius:9px;background:none;font-weight:650;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:flex;flex-direction:column;gap:8px;align-self:stretch}
.steps li{counter-increment:st;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;animation:rise .25s ease-out}
.steps li::before{content:counter(st);width:24px;height:24px;border-radius:50%;background:var(--surface);border:1.5px solid currentColor;display:grid;place-items:center;font:700 .75rem var(--body);opacity:.75}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.ideas li{padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:0 10px 10px 0}
.tip{padding:12px 14px;border-radius:12px;background:var(--gold-soft);border:1px solid var(--gold);align-self:stretch}
.tip b{display:block;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
.hintlink{align-self:flex-start;font-size:.92rem}
.fold.facts ul{list-style:none;margin:0;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;align-self:stretch}
.fold.facts li{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:3px solid var(--line)}
.fold.facts li span{color:var(--muted)}
.fold .guide{padding:0 16px 8px;align-self:stretch}
.fold summary{position:relative;padding-right:40px}
.fold summary::after{content:"";position:absolute;right:18px;top:22px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s}
.fold[open] summary::after{transform:rotate(225deg)}
.field.search input{padding:13px 14px;font-size:1rem;border-radius:12px}
.field>span{font-weight:650;font-size:.9rem}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.pick{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.pick small{color:var(--muted);font-size:.82rem;font-weight:400}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.setup .chips{margin:0;padding:2px 0 6px;flex-wrap:wrap}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
.rowbtn .node{width:36px;height:36px}
.card{box-shadow:0 1px 2px rgba(16,24,40,.04)}
.fb .eyebrow{margin-bottom:-4px}

body.focus #toasts{bottom:calc(24px + var(--safe-b,0px));top:auto}
@media (min-width:820px){#toasts{bottom:24px}}
.toast{max-width:420px;text-align:center}

.fig .softa{fill:var(--accent-soft);fill-opacity:.6}
.fig .z1{fill:var(--good-soft);stroke:var(--good)}.fig .z2{fill:var(--gold-soft);stroke:var(--gold)}.fig .z3{fill:var(--bad-soft);stroke:var(--bad)}
.fig text.sm{font-size:11px;font-weight:500}.fig text.pr{fill:var(--accent)}

/* v4: calmer home, paged lessons */
.card.next .link{align-self:center;font-size:.92rem}
.shortcuts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shortcut{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);text-align:left}
.shortcut:hover{border-color:var(--accent)}
.shortcut small{color:var(--muted);font-size:.84rem}
.sc-ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.course{font-size:.9rem;color:var(--muted);text-align:center}
.course .link{font-weight:650}
.qcard.lesson{min-height:300px;gap:16px}
.idea-n{font-size:.8rem;font-weight:650;color:var(--accent)}
.idea{font-size:1.2rem;line-height:1.5;max-width:60ch}
.qcard.lesson .fig{max-width:300px}
.dots i{width:6px;height:6px}
@media (min-width:700px){.shortcuts{grid-template-columns:repeat(4,1fr)}}

.fig .softe{fill:var(--accent-soft);fill-rule:evenodd}.fig .hand{stroke-width:3}

.sc-ic.gold{background:var(--gold-soft);color:var(--gold)}.sc-ic.bad{background:var(--bad-soft);color:var(--bad)}
.rowbtn .sc-ic{margin:0;flex:none}.rowbtn.dim{opacity:.6}
.rowbtn:disabled{cursor:default}

/* v5: plan and predicted score */
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;align-self:stretch}
.plan li{display:flex;align-items:center;gap:12px}
.plan li.done .qtick{background:var(--good);border-color:var(--good)}
.plan li.done b{color:var(--muted)}
.plan li.cur .qtick{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.pred{display:flex;align-items:baseline;gap:6px}.pred b{font:800 2.6rem/1 var(--display);font-variant-numeric:tabular-nums}.pred small{color:var(--muted);font-weight:600}
.track{position:relative;height:12px;border-radius:99px;background:var(--line);align-self:stretch;margin:6px 0 22px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);transition:width .6s}
.track .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted)}
.track .mark em{position:absolute;top:20px;left:50%;transform:translateX(-50%);font:600 .68rem var(--body);font-style:normal;color:var(--muted);white-space:nowrap}
.track .mark.goal{background:var(--gold);width:3px}.track .mark.goal em{color:var(--gold)}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.predline{font-size:1.05rem}.predline .up{color:var(--good);font-weight:700}

.track{margin-top:22px}.track .mark.up em{top:-18px}

/* ───────── v6: motion and app feel ───────── */
:root{--spring:cubic-bezier(.2,.9,.25,1.15);--out:cubic-bezier(.2,.8,.2,1);--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
html{background:var(--bg)}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;padding-bottom:calc(84px + var(--safe-b))}
button,a,.opt,.chip,.rowbtn,.shortcut,.pick,nav a{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.top{padding-top:var(--safe-t)}
.top-in,main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* tab bar with a sliding highlight */
nav{padding-bottom:calc(10px + var(--safe-b))}
nav a{position:relative;z-index:1;transition:color .2s}
.nav-pill{position:absolute;left:0;top:0;border-radius:12px;background:var(--accent-soft);transition:transform .38s var(--spring),width .3s var(--out),opacity .2s;pointer-events:none;z-index:0}
nav a svg{transition:transform .25s var(--spring)}
nav a[aria-current="page"] svg{animation:navpop .45s var(--spring);fill:color-mix(in srgb,currentColor 18%,transparent)}
@keyframes navpop{0%{transform:scale(1)}40%{transform:scale(.8) translateY(2px)}100%{transform:scale(1)}}
@media (min-width:820px){nav{position:relative}}
#toasts{bottom:calc(92px + var(--safe-b))}

/* header counters */
.stat{transition:transform .2s}
.stat.bump{animation:bump .5s var(--spring)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.28)}100%{transform:scale(1)}}
.stat.flame:not(.lit) svg{color:var(--muted);opacity:.55}
.stat.flame.lit svg{animation:flicker 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flicker{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.06,.96) rotate(-3deg)}60%{transform:scale(.97,1.05) rotate(2deg)}}

/* press feedback on everything you can tap */
.btn,.opt,.rowbtn,.shortcut,.chip,.pick,.seg button,.qgrid button,.icon,.flagbtn,.link{transition:transform .12s var(--out),background .15s,border-color .15s,box-shadow .12s}
.opt:active:not(:disabled),.rowbtn:active,.shortcut:active,.pick:active,.chip:active,.qgrid button:active{transform:scale(.97)}
.btn:not(.primary):active:not(:disabled){transform:scale(.97)}
.icon:active{transform:scale(.85)}
.btn:not(.primary){box-shadow:0 2px 0 var(--line)}
.btn:not(.primary):active{box-shadow:none}
.opt{border-bottom-width:3px}
.opt:active:not(:disabled){border-bottom-width:1.5px;margin-top:1.5px}

/* page transitions */
@keyframes inRight{from{opacity:0;transform:translateX(26px)}}
@keyframes inLeft{from{opacity:0;transform:translateX(-26px)}}
@keyframes inUp{from{opacity:0;transform:translateY(36px)}}
@keyframes inFade{from{opacity:0}}
@keyframes inPop{from{opacity:0;transform:scale(.94)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
#app.in-right{animation:inRight .34s var(--out)}
#app.in-left{animation:inLeft .34s var(--out)}
#app.in-up{animation:inUp .4s var(--out)}
#app.in-fade{animation:inFade .25s ease-out}
#app.in-pop{animation:inPop .4s var(--spring)}
#app.stagger>*{animation:rise .45s var(--out) both}
#app.stagger>*:nth-child(2){animation-delay:.04s}#app.stagger>*:nth-child(3){animation-delay:.08s}#app.stagger>*:nth-child(4){animation-delay:.12s}
#app.stagger>*:nth-child(5){animation-delay:.16s}#app.stagger>*:nth-child(6){animation-delay:.2s}#app.stagger>*:nth-child(n+7){animation-delay:.24s}
#app.stagger .bar:not(.from) i{animation:grow .9s .15s var(--out) both}
@keyframes grow{from{width:0}}
.bar.from i{animation:growFrom 1.1s .5s var(--out) both}
@keyframes growFrom{from{width:var(--from)}}

/* answering */
.just .opt.right{animation:pop .45s var(--spring)}
.just .opt.wrong{animation:shake .42s ease}
.just .opt.right .loz svg,.just .opt.wrong .loz svg{animation:tick .4s .08s var(--spring) both}
.loz svg{width:14px;height:14px;stroke-width:3}
.just .fb{animation:sheetUp .38s var(--out)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes tick{from{transform:scale(0) rotate(-30deg)}}
@keyframes sheetUp{from{opacity:0;transform:translateY(24px)}}
.combo{display:inline-flex;align-items:center;gap:2px;margin-left:6px;padding:1px 8px 1px 4px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-size:.85rem;animation:pop .5s .2s var(--spring) both}
.combo svg{width:15px;height:15px;color:var(--flame)}
.xpfly{position:fixed;z-index:50;pointer-events:none;font:800 1rem var(--display);color:var(--gold);background:var(--gold-soft);border:1.5px solid var(--gold);padding:3px 10px;border-radius:99px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.15)}

/* results */
.result{gap:14px}
.acc-ring{position:relative;width:140px;height:140px;display:grid;place-items:center}
.acc-ring svg{position:absolute;inset:0;width:100%;height:100%;stroke-width:8;stroke-linecap:round}
.acc-ring .ring-fg{animation:ringIn 1.1s .25s var(--out) both}
.acc-ring.good .ring-fg{stroke:var(--good)}.acc-ring.mid .ring-fg{stroke:var(--accent)}.acc-ring.low .ring-fg{stroke:var(--flame)}
.acc-ring b{font:800 3rem/1 var(--display);font-variant-numeric:tabular-nums}.acc-ring small{font:700 1.2rem var(--display);color:var(--muted)}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.res-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-self:stretch}
.res-tiles>div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);animation:rise .45s var(--out) both}
.res-tiles>div:nth-child(2){animation-delay:.08s}.res-tiles>div:nth-child(3){animation-delay:.16s}
.res-tiles b{font:800 1.35rem var(--display);font-variant-numeric:tabular-nums}.res-tiles b.gold{color:var(--gold)}
.res-tiles small{font-size:.74rem;color:var(--muted);text-align:center;line-height:1.3}
.pred-change{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:12px;border:1.5px solid var(--line);align-self:stretch;justify-content:center;animation:rise .45s .25s var(--out) both}
.pred-change span:first-child{color:var(--muted);font-weight:600}
.pred-change b{font:800 1.6rem var(--display);font-variant-numeric:tabular-nums}
.delta{font-weight:800;padding:2px 9px;border-radius:99px;animation:pop .5s 1s var(--spring) both}
.delta.up{background:var(--good-soft);color:var(--good)}.delta.down{background:var(--bad-soft);color:var(--bad)}
.lvl-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;align-self:stretch;font-size:.85rem;color:var(--muted);font-weight:600}

/* overlays and sheets */
.ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;background:var(--bg);animation:inFade .25s ease-out}
.ov.streak{background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--flame) 16%,var(--bg)),var(--bg) 62%)}
.ov.level{background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--accent) 16%,var(--bg)),var(--bg) 62%)}
.ov.out{animation:fadeOut .22s ease-in forwards}
@keyframes fadeOut{to{opacity:0}}
.ov-card{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:inPop .45s var(--spring)}
.ov-num{font:800 4.4rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--flame)}
.bigflame{width:110px;height:110px;display:grid;place-items:center;color:var(--flame);filter:drop-shadow(0 8px 24px color-mix(in srgb,var(--flame) 45%,transparent))}
.bigflame svg{width:100px;height:100px;animation:flameIn .7s var(--spring) both,flicker 2s .7s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flameIn{from{transform:scale(0) translateY(20px);opacity:0}}
.week{display:flex;gap:8px;margin:6px 0}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px}
.wd i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:2px solid var(--line);color:#fff}
.wd i svg{width:16px;height:16px;stroke-width:3}
.wd.on i{background:var(--flame);border-color:var(--flame);animation:pop .4s calc(.5s + var(--i) * .06s) var(--spring) both}
.wd.today i{box-shadow:0 0 0 3px color-mix(in srgb,var(--flame) 35%,transparent)}
.wd small{font-size:.72rem;font-weight:700;color:var(--muted)}
.bigring{position:relative;width:150px;height:150px;display:grid;place-items:center}
.bigring svg{position:absolute;inset:0;width:100%;height:100%;stroke-width:9;stroke-linecap:round}
.bigring .ring-fg{transition:stroke-dashoffset 1.2s var(--out)}
.bigring b{font:800 3.6rem var(--display);animation:inPop .6s .4s var(--spring) both}
.sheet-wrap{position:fixed;inset:0;z-index:55}
.sheet-bg{position:absolute;inset:0;background:rgba(10,14,25,.45);animation:inFade .2s ease-out}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px 20px calc(22px + var(--safe-b));display:flex;flex-direction:column;gap:10px;animation:sheetIn .34s var(--out);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
@media (min-width:600px){.sheet{left:50%;width:520px;transform:translateX(-50%);bottom:24px;border-radius:22px;animation:sheetInC .34s var(--out)}}
.sheet .grab{align-self:center;width:40px;height:5px;border-radius:99px;background:var(--line);margin-bottom:6px}
.sheet-wrap.out .sheet{animation:sheetOut .22s ease-in forwards}.sheet-wrap.out .sheet-bg{animation:fadeOut .22s ease-in forwards}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
@keyframes sheetInC{from{transform:translate(-50%,40px);opacity:0}}

/* home details */
.plan li.pop .qtick{animation:pop .5s .35s var(--spring) both}
.plan li.pop .qtick svg{animation:tick .45s .45s var(--spring) both}
.ring-fg{transition:stroke-dashoffset 1s var(--out)}
.hero .ring b{animation:inPop .5s var(--spring)}

/* flashcards turn over */
.flash.turn{animation:turn .32s var(--out)}
@keyframes turn{from{transform:perspective(800px) rotateY(80deg);opacity:.3}}
.flash-bad{animation:shake .4s ease}
.flash-good{animation:pop .3s var(--spring)}

/* switch */
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;align-self:stretch}
.switchrow span{display:flex;flex-direction:column}.switchrow small{color:var(--muted);font-weight:400;font-size:.84rem}
.switch{flex:none;width:52px;height:32px;border-radius:99px;border:0;background:var(--line);position:relative;transition:background .2s}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s var(--spring)}
.switch[aria-checked="true"]{background:var(--good)}.switch[aria-checked="true"] i{transform:translateX(20px)}

/* splash for the installed app */
#splash{display:none}
#splash.show{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg)}
#splash.out{animation:fadeOut .3s ease-in forwards}
#splash svg{width:84px;height:84px}
#splash rect{transform-box:fill-box;transform-origin:bottom;animation:barUp .55s var(--spring) both}
#splash .b1{fill:var(--muted);animation-delay:.05s}#splash .b2{fill:var(--accent);animation-delay:.15s}#splash .b3{fill:var(--gold);animation-delay:.25s}
#splash b{font:800 1.4rem var(--display);animation:rise .5s .3s var(--out) both}
@keyframes barUp{from{transform:scaleY(0)}}
.logo svg rect{transform-box:fill-box;transform-origin:bottom;transition:transform .3s var(--spring)}
.logo:hover svg rect:nth-child(2){transform:scaleY(1.1)}

/* toasts slide */
.toast{animation:toastIn .35s var(--spring)}
@keyframes toastIn{from{transform:translateY(16px) scale(.95);opacity:0}}

@media (prefers-reduced-motion:reduce){.nav-pill,.ring-fg,.switch i{transition:none!important}}

/* ───────── v7: design refresh ───────── */
:root{
  --bg:#f2f4f9;--surface:#ffffff;--surface2:#f5f7fb;--ink:#0d1530;--muted:#5d6785;--line:#e2e7f1;
  --accent:#3152ff;--accent-ink:#ffffff;--accent-soft:#e7ecff;
  --good:#0e9a6a;--good-soft:#dcf5ea;--bad:#dc3d43;--bad-soft:#fde7e7;--gold:#c98500;--gold-soft:#fff3d4;--flame:#ff6a2b;
  --navy:#0e1638;--r:18px;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#6f87ff;--accent-ink:#0a0f1f;--accent-soft:#1b2550;--good:#3fd29b;--good-soft:#0f3328;--bad:#ff7b7f;--bad-soft:#3e1d20;--gold:#ffc53d;--gold-soft:#3a2d0c;--flame:#ff8a4a;
  --navy:#0d1433;--lift:0 0 0 1px var(--line)}}
:root[data-theme="dark"]{
  --bg:#080c18;--surface:#111729;--surface2:#171f35;--ink:#eef2fb;--muted:#95a2c2;--line:#222b44;
  --accent:#6f87ff;--accent-ink:#0a0f1f;--accent-soft:#1b2550;--good:#3fd29b;--good-soft:#0f3328;--bad:#ff7b7f;--bad-soft:#3e1d20;--gold:#ffc53d;--gold-soft:#3a2d0c;--flame:#ff8a4a;
  --navy:#0d1433;--lift:0 0 0 1px var(--line)}
body{background:var(--bg)}
h1{font-weight:800;letter-spacing:-.02em}
.page-head{padding-top:6px}
.page-head h1{font-size:2.1rem;line-height:1.05}

.section{font:700 .78rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 2px -4px}

/* surfaces: no hard borders, soft lift */
.card,.qcard,.tile,.deck,.rowbtn,.rowstat,.badge,.review,.shortcut,.paper-row,.tile-btn,.flash{border:0;box-shadow:var(--lift);border-radius:var(--r)}

/* hero: night-time podium */
.hero{border:0;border-radius:24px;color:#fff;background:
  radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--accent) 70%,transparent) 0%,transparent 55%),
  radial-gradient(80% 70% at 0% 100%,rgba(255,197,61,.18) 0%,transparent 60%),var(--navy);
  box-shadow:0 18px 40px -12px rgba(14,22,56,.45);padding:22px 22px 20px}
.hero .muted,.hero .hs{color:rgba(255,255,255,.72)}.hero .hs b{color:#fff}
.hero .ring-bg{stroke:rgba(255,255,255,.14)}.hero .ring-fg{stroke:var(--gold);stroke-linecap:round}
.hero .ring b{color:#fff}
.hero .bar{background:rgba(255,255,255,.14)}.hero .bar i{background:linear-gradient(90deg,var(--gold),#ffdf8a)}
.hero h1{color:#fff;font-size:1.65rem}

/* buttons */
.btn{border-radius:14px;font-weight:700;padding:12px 18px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000),0 10px 22px -10px var(--accent)}

.btn:not(.primary){border:0;background:var(--surface);box-shadow:var(--lift),0 2px 0 var(--line)}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* tab bar floats */

    background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 12px 32px -8px rgba(13,21,48,.25)}

.pill{border:0;background:var(--surface2)}
.ideas li{border-left:0;background:var(--surface2);border-radius:14px;position:relative;padding-left:16px}
.ideas li::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:4px;background:var(--accent)}

.empty{border:0;background:var(--surface2);border-radius:var(--r)}

.fig .accent-stroke{stroke:var(--accent);stroke-width:2}

/* ───────── v8: calmer motion, one action bar ───────── */
#app.in-right{animation:inRight .26s var(--out)}
#app.in-left{animation:inLeft .26s var(--out)}
#app.in-up{animation:inUp .3s var(--out)}
#app.in-fade{animation:inFade .16s ease-out}
@keyframes inRight{from{opacity:0;transform:translateX(18px)}}
@keyframes inLeft{from{opacity:0;transform:translateX(-18px)}}
@keyframes inUp{from{opacity:0;transform:translateY(20px)}}
.just .fb{animation:inFade .25s ease-out}

/* options press down without moving anything around them */
.opt{border-bottom-width:2px;box-shadow:0 3px 0 var(--line)}
.opt:active:not(:disabled){border-bottom-width:2px;margin-top:0;transform:translateY(3px);box-shadow:0 0 0 var(--line)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 55%,transparent)}

.opt.dim{box-shadow:none}

/* the action bar */
.abar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + var(--safe-b)) max(16px,env(safe-area-inset-right,0px));transition:background .2s}
.abar.enter{animation:barUp .28s var(--out)}
@keyframes barUp{from{transform:translateY(100%)}}
.abar-in{max-width:680px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.abar-txt{flex:1 1 150px;display:flex;flex-direction:column;min-width:0}
.abar-txt b{font:800 1.15rem var(--display)}
.abar-txt small{color:var(--muted);font-size:.9rem;font-weight:600}
.abar-btns{flex:1 1 220px;display:flex;gap:10px;justify-content:flex-end}
.abar-btns .btn{flex:1;max-width:340px;padding:14px 18px;font-size:1.02rem}
.abar-btns .btn:only-child{max-width:none}
.abar-txt:empty{display:none}
.abar.good{background:var(--good-soft);border-top-color:transparent}.abar.good b{color:var(--good)}
.abar.bad{background:var(--bad-soft);border-top-color:transparent}.abar.bad b{color:var(--bad)}
.abar.good .btn.primary{background:var(--good);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000)}
.abar.bad .btn.primary{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000)}
.abar .btn:disabled{opacity:.4;box-shadow:none}
body.has-bar main{padding-bottom:150px}
body.has-bar #toasts{bottom:calc(110px + var(--safe-b))}

/* first-time guidance */
.cta-pulse{animation:ctaPulse 2.2s ease-in-out infinite}
@keyframes ctaPulse{0%,100%{box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000),0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000),0 0 0 10px transparent}}
.start-tip{align-self:center;font:800 .78rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.cta-pulse,.start-tip{animation:none}}

/* Podium Maths Plus */
.plus-tag{display:inline-flex;align-items:center;gap:4px;font:800 .7rem var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);padding:2px 8px;border-radius:99px;vertical-align:middle}
.plus-tag svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4}
.plus-sheet h2{margin:4px 0 6px}
.plus-list{list-style:none;padding:0;margin:14px 0 16px;display:grid;gap:10px}
.plus-list li{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.plus-list li svg{flex:none;width:20px;height:20px;color:var(--good);stroke:currentColor;fill:none;stroke-width:2.6;margin-top:1px}
.plan-btn{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 10px;padding:14px 16px;border-radius:var(--r);background:var(--surface2);border:2px solid var(--line);color:var(--ink);font:inherit;cursor:pointer}
.plan-btn.best{border-color:var(--gold);background:var(--gold-soft)}
.plan-btn b{font:800 1.05rem var(--display);display:block}.plan-btn small{color:var(--muted);font-weight:600}
.plan-btn .price{font:800 1.1rem var(--display);white-space:nowrap}
.plus-legal{font-size:.76rem;color:var(--muted);line-height:1.45;margin:12px 0 0}
.plus-legal a{color:inherit;text-decoration:underline}
.plus-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.free-left{font-size:.85rem;color:var(--muted);font-weight:600;margin:-4px 0 12px}
.rowbtn.locked .rowbtn-main b,.paper-row.locked .rowbtn-main b{opacity:.75}

</style>

<script>
// Original practice questions written in the style of each paper. Not past-paper questions.
// Q(id, track, topic, difficulty 1-3, stem, options|null, answer index | integer | null, solution)
const QUESTIONS = [];
const Q = (id, tr, tp, d, q, o, a, s) => QUESTIONS.push({ id, tr, tp, d, q, o, a, s });

/* ───────────── Intermediate Mathematical Challenge ───────────── */
Q('i1','imc','Number',1,`What is the value of 2026 − 202.6 + 20.26?`,['1803.14','1823.4','1843.66','1848.86','2248.86'],2,`2026 − 202.6 = 1823.4, and 1823.4 + 20.26 = 1843.66.`);
Q('i2','imc','Number',1,`What is the value of 6 × 7 × 8 ÷ (6 + 7 + 8)?`,['8','12','14','16','21'],3,`6 + 7 + 8 = 21 = 3 × 7. So the answer is (6 × 7 × 8) ÷ (3 × 7) = 2 × 8 = 16. Cancel before you multiply.`);
Q('i3','imc','Ratio & percentages',1,`Half of a third of a quarter of a number is 5. What is the number?`,['120','180','240','360','480'],0,`½ × ⅓ × ¼ = 1/24, so the number is 5 × 24 = 120.`);
Q('i4','imc','Geometry',1,`The angles of a triangle are in the ratio 2 : 3 : 4. What is the size of the largest angle?`,['60°','72°','75°','80°','90°'],3,`There are 9 parts making 180°, so one part is 20°. The largest angle is 4 × 20° = 80°.`);
Q('i5','imc','Number',1,`How many prime numbers are there between 30 and 50?`,['1','2','3','4','5'],4,`They are 31, 37, 41, 43 and 47, which is 5 primes. (33, 39 are multiples of 3; 49 = 7².)`);
Q('i6','imc','Logic & puzzles',1,`A film lasting 2 hours 35 minutes ends at 21:10. At what time did it start?`,['18:25','18:35','18:45','19:35','19:45'],1,`Go back 2 hours to 19:10, then back 35 minutes to 18:35.`);
Q('i7','imc','Algebra',1,`If 3<i>x</i> + 7 = 2<i>x</i> + 19, what is the value of 5<i>x</i>?`,['12','24','48','60','130'],3,`Subtract 2<i>x</i> and 7 from both sides: <i>x</i> = 12, so 5<i>x</i> = 60. Read what the question actually asks for.`);
Q('i8','imc','Ratio & percentages',1,`A coat is reduced by 20% in a sale and now costs £60. What did it cost before the sale?`,['£48','£72','£75','£80','£84'],2,`£60 is 80% of the old price, so the old price is 60 ÷ 0.8 = £75. Adding 20% of £60 gives £72, the classic trap.`);
Q('i9','imc','Number',1,`What is the remainder when 1 + 2 + 3 + … + 20 is divided by 9?`,['0','3','5','6','7'],1,`The sum is ½ × 20 × 21 = 210. Since 207 = 9 × 23, the remainder is 3. (Or: digit sum of 210 is 3.)`);
Q('i10','imc','Geometry',1,`A rectangle has perimeter 30 cm and its length is twice its width. What is its area, in cm²?`,['50','54','56','100','200'],0,`Width <i>w</i>, length 2<i>w</i>: perimeter 6<i>w</i> = 30, so <i>w</i> = 5. Area = 5 × 10 = 50.`);
Q('i11','imc','Logic & puzzles',1,`Ada, Ben and Cal each own a different pet: a cat, a dog and a fish. Ada does not own the dog. Ben owns neither the dog nor the cat. Who owns the cat?`,['Ada','Ben','Cal','It could be Ada or Cal','It is impossible to tell'],0,`Ben must own the fish. Ada does not own the dog, so Ada owns the cat (and Cal owns the dog).`);
Q('i12','imc','Number',1,`Which of these fractions is the largest?`,['3/5','5/8','7/12','11/18','13/20'],4,`Convert each to a decimal. They are 0.6, 0.625, 0.583…, 0.611… and 0.65. The largest is 0.65, which is 13/20.`);
Q('i13','imc','Algebra',1,`The mean of five numbers is 12. When a sixth number is included, the mean becomes 13. What is the sixth number?`,['13','14','16','18','25'],3,`Totals: 5 × 12 = 60 and 6 × 13 = 78. The sixth number is 78 − 60 = 18. Work with totals, not means.`);
Q('i14','imc','Counting & probability',1,`How many two-digit numbers have digits that add up to 9?`,['8','9','10','11','18'],1,`The tens digit can be 1 to 9 and the units digit is then fixed: 18, 27, 36, 45, 54, 63, 72, 81, 90. That is 9 numbers.`);
Q('i15','imc','Ratio & percentages',1,`What is 15% of 40 added to 40% of 15?`,['12','15','18','24','55'],0,`15% of 40 = 6, and 40% of 15 is also 6 (<i>a</i>% of <i>b</i> always equals <i>b</i>% of <i>a</i>). Total 12.`);

Q('i16','imc','Number',2,`The product of three consecutive positive integers is 990. What is their sum?`,['27','30','33','36','39'],1,`10³ = 1000, so try numbers around 10: 9 × 10 × 11 = 990. The sum is 30.`);
Q('i17','imc','Geometry',2,`Each interior angle of a regular polygon is 156°. How many sides does the polygon have?`,['12','15','18','20','24'],1,`Each exterior angle is 180° − 156° = 24°. Exterior angles total 360°, so there are 360 ÷ 24 = 15 sides.`);
Q('i18','imc','Algebra',2,`Given that <i>x</i> + <i>y</i> = 10 and <i>x</i> − <i>y</i> = 4, what is the value of <i>x</i>² − <i>y</i>²?`,['14','21','40','58','84'],2,`<i>x</i>² − <i>y</i>² = (<i>x</i> + <i>y</i>)(<i>x</i> − <i>y</i>) = 10 × 4 = 40. No need to find <i>x</i> and <i>y</i>.`);
Q('i19','imc','Ratio & percentages',2,`Zara cycles to school at 12 km/h and returns along the same route at 8 km/h. What is her average speed for the whole journey, in km/h?`,['9','9.6','10','10.4','11'],1,`Take the distance each way as 24 km: 2 hours out, 3 hours back. Total 48 km in 5 hours = 9.6 km/h. It is never just the mean of the speeds.`);
Q('i20','imc','Number',2,`How many positive factors does 72 have?`,['6','8','9','10','12'],4,`72 = 2³ × 3². The number of factors is (3 + 1)(2 + 1) = 12.`);
Q('i21','imc','Geometry',2,`The diagonal of a square has length 10 cm. What is the area of the square, in cm²?`,['25','50','50√2','100','200'],1,`The area of a square is half the diagonal squared. That is ½ × 100 = 50. You can also find the side, 10/√2, whose square is 50.`);
Q('i22','imc','Number',2,`What is the last digit of 7<sup>2026</sup>?`,['1','3','5','7','9'],4,`Last digits of powers of 7 cycle 7, 9, 3, 1. Since 2026 leaves remainder 2 when divided by 4, the last digit is the second in the cycle: 9.`);
Q('i23','imc','Ratio & percentages',2,`In a class the ratio of boys to girls is 3 : 5. There are 8 more girls than boys. How many pupils are in the class?`,['32','40','48','56','64'],0,`The difference of 2 parts is 8 pupils, so 1 part is 4. There are 8 parts in total: 32 pupils.`);
Q('i24','imc','Counting & probability',2,`In how many different ways can the letters of the word LEVEL be arranged in a row?`,['10','20','30','60','120'],2,`5 letters with L twice and E twice: 5! ÷ (2! × 2!) = 120 ÷ 4 = 30.`);
Q('i25','imc','Algebra',2,`The sum of five consecutive odd numbers is 135. What is the largest of them?`,['23','25','27','29','31'],4,`The middle number is the mean: 135 ÷ 5 = 27. The numbers are 23, 25, 27, 29, 31.`);
Q('i26','imc','Geometry',2,`A circle fits exactly inside a square of side 4 cm, touching all four sides. What is the area, in cm², of the region inside the square but outside the circle?`,['4π − 8','8 − 2π','16 − 2π','16 − 4π','16π − 16'],3,`The circle has radius 2, so its area is 4π. The square has area 16. The difference is 16 − 4π.`);
Q('i27','imc','Number',2,`What is the smallest integer greater than 1 that leaves a remainder of 1 when divided by each of 2, 3, 4, 5 and 6?`,['31','41','61','121','721'],2,`One less than the number is a multiple of 2, 3, 4, 5 and 6. Their lowest common multiple is 60, so the number is 61.`);
Q('i28','imc','Counting & probability',2,`Two fair dice are rolled. What is the probability that the two scores add up to 8?`,['1/12','1/9','5/36','1/6','7/36'],2,`The pairs are (2,6), (3,5), (4,4), (5,3), (6,2): 5 outcomes out of 36.`);
Q('i29','imc','Number',2,`What is the value of 2026² − 2025²?`,['1','2025','2026','4051','4052'],3,`Difference of two squares: (2026 − 2025)(2026 + 2025) = 1 × 4051 = 4051.`);
Q('i30','imc','Logic & puzzles',2,`Knights always tell the truth and knaves always lie. Of three islanders, the first says “We are all knaves.” The second says “Exactly one of us is a knight.” How many are knaves?`,['0','1','2','3','It is impossible to tell'],2,`The first cannot be a knight (a knight could not truthfully say that), so the first is a knave and not all three are knaves. If the second were a knave, the third would have to be the only knight, making the second’s statement true: contradiction. So the second is a knight, the only one, and there are 2 knaves.`);

Q('i31','imc','Number',3,`How many positive integers less than 1000 are multiples of 6 but not multiples of 9?`,['55','100','105','110','111'],4,`Multiples of 6 below 1000: 166. Those also divisible by 9 are the multiples of 18: 55. So 166 − 55 = 111.`);
Q('i32','imc','Geometry',3,`A right-angled triangle has shorter sides of length 6 and 8. What is the radius of the largest circle that fits inside the triangle?`,['1','1.5','2','2.4','3'],2,`The hypotenuse is 10. Area = 24 = ½ × <i>r</i> × perimeter = ½ × <i>r</i> × 24, so <i>r</i> = 2. Shortcut for right-angled triangles: <i>r</i> = (<i>a</i> + <i>b</i> − <i>c</i>) ÷ 2.`);
Q('i33','imc','Algebra',4,`The positive integers <i>m</i> and <i>n</i> satisfy <i>mn</i> + <i>m</i> + <i>n</i> = 34. What is the value of <i>m</i> + <i>n</i>?`,['9','10','11','12','16'],1,`Add 1 to both sides: (<i>m</i> + 1)(<i>n</i> + 1) = 35 = 5 × 7 (1 × 35 would make one of them 0). So <i>m</i> and <i>n</i> are 4 and 6, with sum 10.`);
Q('i34','imc','Counting & probability',4,`How many three-digit numbers have digits that strictly increase from left to right (such as 258)?`,['72','84','96','120','504'],1,`No digit can be 0. Choose any 3 different digits from 1 to 9; there is exactly one increasing order. That gives 9 × 8 × 7 ÷ 6 = 84.`);
Q('i35','imc','Number',3,`The number 2<sup>12</sup> × 5<sup>8</sup> is written out in full. How many digits does it have?`,['8','9','10','12','20'],2,`2<sup>12</sup> × 5<sup>8</sup> = 2⁴ × 10⁸ = 16 × 10⁸ = 1 600 000 000, which has 10 digits.`);
Q('i36','imc','Geometry',3,`What is the area of a regular hexagon with sides of length 2?`,['6√3','12','8√3','12√3','24'],0,`A regular hexagon is six equilateral triangles. Each has area (√3/4) × 2² = √3, so the total is 6√3.`);
Q('i37','imc','Ratio & percentages',3,`A tap fills a bath in 12 minutes. The plughole empties the full bath in 20 minutes. With the tap on and the plug out, how many minutes does the empty bath take to fill?`,['8','16','24','30','32'],3,`Each minute the tap adds 1/12 of a bath and the plughole removes 1/20. Net: 1/12 − 1/20 = 1/30 per minute, so 30 minutes.`);
Q('i38','imc','Number',3,`How many zeros are there at the end of 50! (the product of all the integers from 1 to 50)?`,['5','10','11','12','25'],3,`Count factors of 5: there are 10 multiples of 5, and 25 and 50 each give one extra. 10 + 2 = 12.`);
Q('i39','imc','Algebra',3,`The number <i>x</i> satisfies <i>x</i> + 1/<i>x</i> = 3. What is the value of <i>x</i>² + 1/<i>x</i>²?`,['7','8','9','10','11'],0,`Square both sides: <i>x</i>² + 2 + 1/<i>x</i>² = 9, so <i>x</i>² + 1/<i>x</i>² = 7.`);
Q('i40','imc','Counting & probability',3,`A bag contains 3 red counters and 5 blue counters. Two counters are taken at random without replacement. What is the probability that they are different colours?`,['15/64','3/8','15/32','1/2','15/28'],4,`Red then blue: 3/8 × 5/7 = 15/56. Blue then red: 5/8 × 3/7 = 15/56. Total 30/56 = 15/28.`);
Q('i41','imc','Geometry',3,`A circle passes through all four vertices of a square of side 2. What is the area of the region inside the circle but outside the square?`,['4 − π','π − 2','2π − 2','4π − 4','2π − 4'],4,`The diameter is the diagonal, 2√2, so the radius is √2 and the circle has area 2π. Subtract the square: 2π − 4.`);
Q('i42','imc','Counting & probability',4,`The digits 1, 2, 3, 4 and 5 are each used once to make a five-digit number. How many of these numbers are multiples of 4?`,['6','12','16','18','24'],4,`A number is a multiple of 4 when its last two digits are. The possible endings are 12, 24, 32 and 52. For each, the other three digits can be arranged in 3! = 6 ways: 4 × 6 = 24.`);
Q('i43','imc','Number',3,`What is the sum of all the positive factors of 100?`,['117','186','216','217','248'],3,`100 = 2² × 5². The sum of factors is (1 + 2 + 4)(1 + 5 + 25) = 7 × 31 = 217.`);
Q('i44','imc','Algebra',4,`In a sequence, each term after the second is the sum of the two terms before it. The third term is 7 and the sixth term is 31. What is the seventh term?`,['43','45','48','50','55'],3,`Call the first two terms <i>a</i>, <i>b</i>. The terms are <i>a</i>, <i>b</i>, <i>a</i>+<i>b</i>, <i>a</i>+2<i>b</i>, 2<i>a</i>+3<i>b</i>, 3<i>a</i>+5<i>b</i>. From <i>a</i>+<i>b</i> = 7 and 3<i>a</i>+5<i>b</i> = 31 we get <i>b</i> = 5, <i>a</i> = 2. The fifth term is 19, so the seventh is 19 + 31 = 50.`);
Q('i45','imc','Geometry',4,`A triangle has sides of length 13, 14 and 15. What is its area?`,['84','90','91','97.5','105'],0,`Drop the height onto the side of length 14: it splits the triangle into 5-12-13 and 9-12-15 right-angled triangles (5 + 9 = 14). The height is 12, so the area is ½ × 14 × 12 = 84.`);

/* ───────────── Senior Mathematical Challenge ───────────── */
Q('s1','smc','Number',1,`What is the value of 2<sup>10</sup> − 2<sup>9</sup> − 2<sup>8</sup>?`,['0','2<sup>7</sup>','2<sup>8</sup>','2<sup>9</sup>','2<sup>10</sup>'],2,`2<sup>10</sup> − 2<sup>9</sup> = 2<sup>9</sup>, and 2<sup>9</sup> − 2<sup>8</sup> = 2<sup>8</sup>.`);
Q('s2','smc','Algebra',1,`How many integers <i>n</i> satisfy <i>n</i>² &lt; 50?`,['7','8','14','15','49'],3,`<i>n</i> can be anything from −7 to 7 inclusive (7² = 49). That is 15 integers. Do not forget zero and the negatives.`);
Q('s3','smc','Algebra',1,`The line <i>y</i> = 2<i>x</i> + <i>c</i> is a tangent to the curve <i>y</i> = <i>x</i>². What is the value of <i>c</i>?`,['−2','−1','0','1','2'],1,`<i>x</i>² − 2<i>x</i> − <i>c</i> = 0 must have a repeated root, so the discriminant 4 + 4<i>c</i> = 0, giving <i>c</i> = −1.`);
Q('s4','smc','Functions & trigonometry',1,`What is the value of sin²10° + sin²20° + sin²30° + … + sin²80°?`,['2','2.5','3','3.5','4'],4,`sin 80° = cos 10°, so sin²10° + sin²80° = 1. The eight terms pair up into four pairs, each summing to 1.`);
Q('s5','smc','Number',1,`What is the sum of the digits of 10<sup>20</sup> − 20?`,['162','170','171','178','180'],1,`10<sup>20</sup> − 20 is eighteen 9s followed by 80. Digit sum = 18 × 9 + 8 = 170.`);
Q('s6','smc','Algebra',1,`Given that 4<sup><i>x</i></sup> = 8, what is the value of 16<sup><i>x</i></sup>?`,['16','32','48','64','128'],3,`16<sup><i>x</i></sup> = (4<sup><i>x</i></sup>)² = 8² = 64.`);
Q('s7','smc','Algebra',1,`The roots of <i>x</i>² − 5<i>x</i> + 3 = 0 are <i>p</i> and <i>q</i>. What is the value of <i>p</i>² + <i>q</i>²?`,['19','22','25','28','31'],0,`<i>p</i> + <i>q</i> = 5 and <i>pq</i> = 3. So <i>p</i>² + <i>q</i>² = (<i>p</i> + <i>q</i>)² − 2<i>pq</i> = 25 − 6 = 19.`);
Q('s8','smc','Geometry',1,`A cube has surface area 54. What is the length of the diagonal joining two opposite corners of the cube?`,['√3','3','2√3','3√2','3√3'],4,`Each face has area 9, so the side is 3. The space diagonal of a cube of side <i>s</i> is <i>s</i>√3 = 3√3.`);
Q('s9','smc','Counting & probability',1,`Five people sit in a row. Two of them insist on sitting next to each other. How many seating arrangements are possible?`,['24','48','60','96','120'],1,`Treat the pair as one block: 4 objects give 4! = 24 orders, and the pair can swap places: 24 × 2 = 48.`);

Q('s10','smc','Number',2,`What is the remainder when 3<sup>100</sup> is divided by 8?`,['1','3','5','7','0'],0,`3² = 9 leaves remainder 1 on division by 8, and 3<sup>100</sup> = (3²)<sup>50</sup>, so the remainder is 1.`);
Q('s11','smc','Geometry',2,`A chord of length 8 is drawn in a circle of radius 5. A second chord of length 6 is drawn parallel to it on the opposite side of the centre. How far apart are the chords?`,['5','6','7','8','10'],2,`Half-chords of 4 and 3 with radius 5 give distances 3 and 4 from the centre (3-4-5 triangles). On opposite sides the gap is 3 + 4 = 7.`);
Q('s12','smc','Algebra',2,`The sum of the first <i>n</i> positive odd integers is 2025. What is the value of <i>n</i>?`,['45','46','90','1012','1013'],0,`The sum of the first <i>n</i> odd numbers is <i>n</i>². Since 45² = 2025, <i>n</i> = 45.`);
Q('s13','smc','Functions & trigonometry',2,`How many real solutions does the equation |<i>x</i>² − 4| = 3 have?`,['0','1','2','3','4'],4,`The modulus equals 3 in two ways. First, <i>x</i>² − 4 = 3 gives <i>x</i>² = 7, so <i>x</i> = ±√7. Second, <i>x</i>² − 4 = −3 gives <i>x</i>² = 1, so <i>x</i> = ±1. That makes four solutions.`);
Q('s14','smc','Geometry',2,`An equilateral triangle and a regular hexagon have the same perimeter. What is the ratio of the area of the triangle to the area of the hexagon?`,['1 : 2','2 : 3','3 : 4','1 : √3','1 : 1'],1,`If the hexagon has side <i>s</i>, the triangle has side 2<i>s</i>. The triangle splits into 4 small equilateral triangles of side <i>s</i>; the hexagon is 6 of them. Ratio 4 : 6 = 2 : 3.`);
Q('s15','smc','Algebra',2,`How many pairs of positive integers (<i>x</i>, <i>y</i>) satisfy 1/<i>x</i> + 1/<i>y</i> = 1/6?`,['5','6','8','9','12'],3,`Rearranging gives (<i>x</i> − 6)(<i>y</i> − 6) = 36. Both brackets must be positive, and 36 has 9 positive factors, so there are 9 ordered pairs.`);
Q('s16','smc','Functions & trigonometry',2,`The function <i>f</i> satisfies <i>f</i>(<i>x</i>) + 2<i>f</i>(1/<i>x</i>) = 3<i>x</i> for all non-zero <i>x</i>. What is the value of <i>f</i>(2)?`,['−2','−1','0','1','2'],1,`Put <i>x</i> = 2: <i>f</i>(2) + 2<i>f</i>(½) = 6. Put <i>x</i> = ½: <i>f</i>(½) + 2<i>f</i>(2) = 3/2. Eliminating <i>f</i>(½) gives −3<i>f</i>(2) = 3, so <i>f</i>(2) = −1.`);
Q('s17','smc','Counting & probability',2,`Three fair dice are rolled. What is the probability that all three show different numbers?`,['5/36','5/18','4/9','1/2','5/9'],4,`(6 × 5 × 4) ÷ 6³ = 120/216 = 5/9.`);
Q('s18','smc','Number',2,`What is the units digit of 1! + 2! + 3! + … + 100!?`,['3','4','5','7','9'],0,`From 5! onwards every term ends in 0. 1 + 2 + 6 + 24 = 33, so the units digit is 3.`);

Q('s19','smc','Number',3,`What is the largest power of 2 that divides 20!?`,['2<sup>10</sup>','2<sup>16</sup>','2<sup>17</sup>','2<sup>18</sup>','2<sup>20</sup>'],3,`Count factors of 2: ⌊20/2⌋ + ⌊20/4⌋ + ⌊20/8⌋ + ⌊20/16⌋ = 10 + 5 + 2 + 1 = 18.`);
Q('s20','smc','Number',3,`How many pairs of positive integers (<i>a</i>, <i>b</i>) satisfy <i>a</i>² − <i>b</i>² = 105?`,['2','3','4','6','8'],2,`(<i>a</i> − <i>b</i>)(<i>a</i> + <i>b</i>) = 105 = 3 × 5 × 7. The factor pairs are 1 × 105, 3 × 35, 5 × 21 and 7 × 15; every factor is odd, so each pair gives integer <i>a</i> and <i>b</i>. Four pairs.`);
Q('s21','smc','Geometry',3,`In triangle <i>ABC</i>, <i>AB</i> = 7, <i>BC</i> = 8 and <i>CA</i> = 9. What is the value of cos <i>B</i>?`,['1/7','2/7','1/3','3/7','1/2'],1,`Cosine rule: cos <i>B</i> = (7² + 8² − 9²) ÷ (2 × 7 × 8) = 32/112 = 2/7.`);
Q('s22','smc','Algebra',3,`What is the value of 1/(1×2) + 1/(2×3) + 1/(3×4) + … + 1/(99×100)?`,['4/5','9/10','49/50','98/99','99/100'],4,`Each term is 1/<i>n</i> − 1/(<i>n</i> + 1), so the sum telescopes to 1 − 1/100 = 99/100.`);
Q('s23','smc','Counting & probability',3,`How many of the integers from 1 to 100 inclusive are divisible by none of 2, 3 and 5?`,['22','24','26','28','30'],2,`Inclusion–exclusion: 50 + 33 + 20 − 16 − 10 − 6 + 3 = 74 are divisible by at least one. That leaves 100 − 74 = 26.`);
Q('s24','smc','Geometry',3,`A sphere is inscribed in a cube, and the cube is inscribed in a larger sphere. What is the ratio of the volume of the larger sphere to the volume of the smaller sphere?`,['2√2','3','3√3','8','9'],2,`For a cube of side <i>s</i> the radii are <i>s</i>/2 and <i>s</i>√3/2, a ratio of √3. Volumes scale with the cube: (√3)³ = 3√3.`);
Q('s25','smc','Algebra',3,`The real numbers <i>x</i> and <i>y</i> satisfy <i>x</i>² + <i>y</i>² = 1. What is the largest possible value of 3<i>x</i> + 4<i>y</i>?`,['5','6','7','12','25'],0,`The line 3<i>x</i> + 4<i>y</i> = <i>k</i> is at distance <i>k</i>/5 from the origin, and it must touch the unit circle, so <i>k</i> = 5 (reached at <i>x</i> = 3/5, <i>y</i> = 4/5).`);
Q('s26','smc','Counting & probability',3,`Three vertices of a regular octagon are chosen to form a triangle. How many of these triangles are right-angled?`,['12','16','20','24','28'],3,`The vertices lie on a circle, so the triangle is right-angled exactly when one side is a diameter. There are 4 diameters and 6 choices for the third vertex: 4 × 6 = 24.`);
Q('s27','smc','Algebra',3,`The positive numbers <i>x</i> and <i>y</i> satisfy <i>x</i> + <i>y</i> = 10. What is the largest possible value of <i>x</i>²<i>y</i>?`,['125','144','4000/27','150','160'],2,`By AM–GM on <i>x</i>/2, <i>x</i>/2 and <i>y</i>: their sum is 10, so their product (<i>x</i>²<i>y</i>/4) is at most (10/3)³. So <i>x</i>²<i>y</i> ≤ 4000/27, reached at <i>x</i> = 20/3.`);
Q('s28','smc','Number',3,`How many pairs of positive integers (<i>x</i>, <i>y</i>) with <i>x</i> &lt; <i>y</i> satisfy <i>x</i> + <i>y</i> + <i>xy</i> = 2026?`,['0','1','2','4','2027'],0,`Add 1: (<i>x</i> + 1)(<i>y</i> + 1) = 2027. But 2027 is prime, so one bracket would have to be 1, making <i>x</i> = 0. There are no such pairs.`);
