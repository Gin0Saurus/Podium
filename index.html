   `Q16–20 are worth 6 marks and a wrong answer loses 1. Q21–25 are worth 6 and a wrong answer loses 2.`,
   `Bank the first 15 carefully before you spend time on the hard ones. A slip on Q3 costs as much as most of Q20.`,
   `Use the options: test them, estimate, and rule out the ones that cannot be right.`],
  `On Q23 you have ruled out three options and cannot decide between the last two. Should you guess?`,
  [`A right answer on Q21–25 gains 6 marks. A wrong answer loses 2.`,
   `With two options left, each is equally likely: half the time you gain 6, half the time you lose 2.`,
   `On average that is (6 − 2) ÷ 2 = +2 marks per guess.`,
   `So yes, guess. Compare a blind guess between all five: (6 − 2 − 2 − 2 − 2) ÷ 5 = −0.4, which loses marks on average.`],
  `On Q21–25, guess only when you have ruled out at least two options.`);
LS('div', 'imc', 'Number', 1, 'Divisibility and remainders', 'Spot multiples without dividing',
  [`3 and 9: add the digits. If the digit sum is a multiple of 3 (or 9), so is the number.`,
   `4: look at the last two digits. 8: look at the last three.`,
   `11: alternately add and subtract the digits. A result of 0 or a multiple of 11 means divisible by 11.`,
   `The remainder on dividing by 9 is the same as the remainder of the digit sum.`,
   `“Leaves remainder 1 when divided by 2, 3, 4…” means one more than a common multiple. Find the LCM and add 1.`],
  `What is the remainder when 7358 is divided by 9?`,
  [`Add the digits: 7 + 3 + 5 + 8 = 23.`,
   `23 is still big, so add its digits: 2 + 3 = 5.`,
   `The remainder on dividing by 9 matches the digit sum, so the remainder is 5.`,
   `Check: 9 × 817 = 7353, and 7358 − 7353 = 5.`],
  `Digit sums answer most questions about 3 and 9 in seconds.`);
LS('pct', 'imc', 'Ratio & percentages', 1, 'Percentages without the traps', 'Multipliers and working backwards',
  [`Turn every percentage change into a multiplier: up 15% is × 1.15, down 20% is × 0.8.`,
   `To undo a change, divide by the multiplier. Never add the percentage back on.`,
   `Two changes in a row: multiply the multipliers. Up 25% then down 20% is 1.25 × 0.8 = 1.`,
   `<i>a</i>% of <i>b</i> equals <i>b</i>% of <i>a</i>. So 36% of 25 is 25% of 36, which is 9.`],
  `After a 15% rise, a ticket costs £46. What did it cost before the rise?`,
  [`A 15% rise multiplies the old price by 1.15.`,
   `So old price × 1.15 = 46.`,
   `Divide: 46 ÷ 1.15 = 40.`,
   `The ticket cost £40. Check: 15% of 40 is 6, and 40 + 6 = 46.`],
  `The percentage is always of the original amount, so reverse a change by dividing.`);
LS('ang', 'imc', 'Geometry', 1, 'Angles and polygons', 'Exterior angles are the fast route',
  [`Angles in a triangle add to 180°. Angles in a quadrilateral add to 360°.`,
   `The exterior angles of any polygon add to 360°.`,
   `In a regular polygon with <i>n</i> sides, each exterior angle is 360° ÷ <i>n</i> and each interior angle is 180° minus that.`,
   `Look for isosceles triangles: equal sides mean equal base angles. Radii of a circle are always equal.`,
   `Diagrams are not drawn to scale. Never judge an angle by eye.`],
  `Each interior angle of a regular polygon is 150°. How many sides does it have?`,
  [`Find the exterior angle: 180° − 150° = 30°.`,
   `The exterior angles add up to 360°.`,
   `So the number of sides is 360 ÷ 30 = 12.`],
  `Regular polygon question? Go straight to the exterior angle.`);
LS('logic', 'imc', 'Logic & puzzles', 1, 'Logic puzzles', 'Try a case and hunt for a contradiction',
  [`Start with the clue that restricts the most.`,
   `For “who owns what” puzzles, write the facts as an ordered list or a small grid.`,
   `For truth-tellers and liars, assume one person tells the truth and follow the consequences. A contradiction kills that case.`,
   `For days and clocks, use remainders: days repeat every 7.`],
  `A says “B is lying.” B says “C is lying.” C says “A and B are both lying.” Who is telling the truth?`,
  [`Suppose C tells the truth. Then A and B are both lying.`,
   `If B is lying, then C is not lying. Fine so far.`,
   `If A is lying, then B is not lying. But we just said B is lying: contradiction. So C is lying.`,
   `Since C is lying, B’s statement is true, so B tells the truth.`,
   `A says B is lying, which is false, so A is lying. Only B tells the truth.`],
  `Assume, follow it through, and let contradictions do the work.`);
LS('fac', 'imc', 'Number', 2, 'Primes, factors and zeros', 'Prime factorise first',
  [`Write the number as a product of prime powers. Most factor questions fall apart after that.`,
   `Number of factors: add 1 to each power and multiply. 72 = 2³ × 3² has 4 × 3 = 12 factors.`,
   `Only square numbers have an odd number of factors.`,
   `Zeros at the end of <i>n</i>!: count the 5s. Divide <i>n</i> by 5, by 25, by 125, and add the whole-number parts.`,
   `HCF × LCM equals the product of the two numbers.`],
  `How many positive factors does 360 have?`,
  [`Factorise: 360 = 36 × 10 = 2³ × 3² × 5.`,
   `The powers are 3, 2 and 1.`,
   `Add 1 to each and multiply: 4 × 3 × 2 = 24.`,
   `So 360 has 24 factors.`],
  `Add one to each power, then multiply.`);
LS('last', 'imc', 'Number', 2, 'Last digits and big powers', 'You never need the whole number',
  [`The last digit of a sum or product depends only on the last digits.`,
   `Last digits of powers repeat in short cycles. For 2: 2, 4, 8, 6. For 3: 3, 9, 7, 1. For 7: 7, 9, 3, 1.`,
   `Every cycle has length 1, 2 or 4, so use the remainder of the power when divided by 4.`,
   `For big subtractions such as 2026² − 2025², use the difference of two squares.`],
  `What is the last digit of 3<sup>2027</sup>?`,
  [`The last digits of powers of 3 go 3, 9, 7, 1 and then repeat.`,
   `The cycle has length 4, so find the remainder when 2027 is divided by 4.`,
   `2024 is a multiple of 4, so the remainder is 3.`,
   `The third number in the cycle is 7. The last digit is 7.`],
  `Remainder of the power on dividing by 4, then read off the cycle.`);
LS('rate', 'imc', 'Ratio & percentages', 2, 'Ratio, speed and rates', 'Totals, parts and rates',
  [`For ratios, find the value of one part first.`,
   `Turn means into totals straight away: total = mean × how many.`,
   `Average speed is total distance ÷ total time. It is never the mean of the speeds.`,
   `When people or taps work together, add their rates (jobs per hour), not their times.`],
  `Ali can paint a fence in 6 hours. Bea can paint it in 3 hours. How long do they take working together?`,
  [`Ali paints 1/6 of the fence per hour.`,
   `Bea paints 1/3 of the fence per hour.`,
   `Together: 1/6 + 1/3 = 1/2 of the fence per hour.`,
   `So the whole fence takes 2 hours.`],
  `Add rates, not times.`);
LS('area', 'imc', 'Geometry', 2, 'Lengths, areas and circles', 'Triples, shaded regions and scale',
  [`Know the triples: 3-4-5, 5-12-13, 8-15-17, 7-24-25 and their multiples.`,
   `A square of side <i>s</i> has diagonal <i>s</i>√2. From the diagonal <i>d</i>, the area is ½<i>d</i>².`,
   `Shaded regions are almost always “big shape minus small shape”.`,
   `If lengths are multiplied by <i>k</i>, areas are multiplied by <i>k</i>² and volumes by <i>k</i>³.`,
   `Equilateral triangle of side <i>s</i>: area (√3 ÷ 4)<i>s</i>².`],
  `A square is drawn inside a circle of radius 5 with all four corners on the circle. What is the area of the square?`,
  [`The diagonal of the square is a diameter of the circle.`,
   `So the diagonal is 2 × 5 = 10.`,
   `The area of a square is half the diagonal squared.`,
   `Area = ½ × 10² = 50.`],
  `Find the length the two shapes share. It is usually a radius or a diagonal.`);
LS('alg', 'imc', 'Algebra', 2, 'Algebra shortcuts', 'Combine, do not solve',
  [`<i>a</i>² − <i>b</i>² = (<i>a</i> − <i>b</i>)(<i>a</i> + <i>b</i>). It appears on almost every paper.`,
   `If the question asks for <i>a</i> + <i>b</i> + <i>c</i>, try adding all the equations before solving anything.`,
   `For consecutive numbers with a known sum, the middle number is the mean.`,
   `<i>mn</i> + <i>m</i> + <i>n</i>: add 1 and factorise as (<i>m</i> + 1)(<i>n</i> + 1).`,
   `Read the last line again. If it asks for 5<i>x</i>, do not answer <i>x</i>.`],
  `Given that <i>a</i> − <i>b</i> = 5 and <i>a</i>² − <i>b</i>² = 65, what is the value of <i>a</i>?`,
  [`Factorise the second equation: (<i>a</i> − <i>b</i>)(<i>a</i> + <i>b</i>) = 65.`,
   `We know <i>a</i> − <i>b</i> = 5, so <i>a</i> + <i>b</i> = 65 ÷ 5 = 13.`,
   `Add the two equations: 2<i>a</i> = 18.`,
   `So <i>a</i> = 9.`],
  `See two squares subtracted? Factorise before anything else.`);
LS('count', 'imc', 'Counting & probability', 2, 'Counting without listing', 'Multiply the choices',
  [`If one choice has 3 options and the next has 4, there are 3 × 4 ways to make both.`,
   `<i>n</i> different things can be arranged in <i>n</i>! ways.`,
   `If some things are identical, divide by the factorial of each repeat. LEVEL: 5! ÷ (2! × 2!) = 30.`,
   `Choosing 3 from 9 when order does not matter: 9 × 8 × 7 ÷ (3 × 2 × 1) = 84.`,
   `Sometimes it is easier to count what you do not want and subtract.`],
  `How many three-digit numbers have three different digits?`,
  [`The first digit can be 1 to 9: that is 9 choices (it cannot be 0).`,
   `The second digit can be anything except the first: 9 choices, because 0 is now allowed.`,
   `The third digit must differ from both: 8 choices.`,
   `Multiply: 9 × 9 × 8 = 648.`],
  `Fill the most restricted position first.`);
LS('prob', 'imc', 'Counting & probability', 3, 'Probability', 'Favourable over total',
  [`With equally likely outcomes, probability = favourable outcomes ÷ total outcomes.`,
   `Two dice have 36 outcomes. List the pairs that work.`,
   `“And” for independent events: multiply. “Or” for events that cannot both happen: add.`,
   `“At least one” is 1 minus the probability of none.`,
   `Without replacement, the second fraction has one fewer on the bottom.`],
  `Two fair dice are rolled. What is the probability that at least one shows a six?`,
  [`Work out the opposite: no six at all.`,
   `Each die avoids a six with probability 5/6.`,
   `Both avoid it with probability 5/6 × 5/6 = 25/36.`,
   `So at least one six has probability 1 − 25/36 = 11/36.`],
  `For “at least one”, find “none” and subtract from 1.`);

/* Senior */
LS('quad', 'smc', 'Algebra', 2, 'Quadratics and their roots', 'Use the sum and product',
  [`For <i>x</i>² + <i>bx</i> + <i>c</i> = 0, the roots add to −<i>b</i> and multiply to <i>c</i>.`,
   `You rarely need the roots themselves. <i>p</i>² + <i>q</i>² = (<i>p</i> + <i>q</i>)² − 2<i>pq</i>.`,
   `A line is tangent to a curve when their intersection equation has a repeated root: discriminant zero.`,
   `Complete the square to find a minimum or maximum without calculus.`],
  `The roots of <i>x</i>² − 6<i>x</i> + 4 = 0 are <i>p</i> and <i>q</i>. What is the value of 1/<i>p</i> + 1/<i>q</i>?`,
  [`Sum of roots: <i>p</i> + <i>q</i> = 6. Product of roots: <i>pq</i> = 4.`,
   `Put the fractions over a common denominator: 1/<i>p</i> + 1/<i>q</i> = (<i>p</i> + <i>q</i>) ÷ <i>pq</i>.`,
   `Substitute: 6 ÷ 4 = 3/2.`],
  `Rewrite what you are asked for in terms of the sum and the product.`);
LS('trig', 'smc', 'Functions & trigonometry', 2, 'Trigonometry essentials', 'Exact values and the two rules',
  [`Know sin, cos and tan of 30°, 45° and 60° exactly.`,
   `sin²<i>x</i> + cos²<i>x</i> = 1, and sin(90° − <i>x</i>) = cos <i>x</i>.`,
   `Cosine rule: <i>c</i>² = <i>a</i>² + <i>b</i>² − 2<i>ab</i> cos <i>C</i>. Use it with three sides, or two sides and the angle between them.`,
   `Area of a triangle = ½<i>ab</i> sin <i>C</i>.`],
  `A triangle has sides of length 5 and 8 with an angle of 60° between them. How long is the third side?`,
  [`Two sides and the included angle: use the cosine rule.`,
   `<i>c</i>² = 5² + 8² − 2 × 5 × 8 × cos 60°.`,
   `cos 60° = ½, so <i>c</i>² = 25 + 64 − 40 = 49.`,
   `So <i>c</i> = 7.`],
  `Angles that add to 90° swap sine and cosine.`);
LS('nt', 'smc', 'Number', 3, 'Number theory for the Senior paper', 'Factor pairs and remainders',
  [`Equations in integers usually factorise. Rearrange into (something)(something) = a number, then list factor pairs.`,
   `Check signs and sizes: each factor pair must give positive integers if the question asks for them.`,
   `Remainders settle “can this ever happen” questions. Squares leave remainder 0 or 1 when divided by 4.`,
   `Largest power of a prime <i>p</i> dividing <i>n</i>!: add up <i>n</i> ÷ <i>p</i>, <i>n</i> ÷ <i>p</i>², … rounded down.`],
  `How many pairs of positive integers (<i>x</i>, <i>y</i>) satisfy <i>xy</i> − 2<i>x</i> − 3<i>y</i> = 6?`,
  [`Complete the rectangle: (<i>x</i> − 3)(<i>y</i> − 2) = <i>xy</i> − 2<i>x</i> − 3<i>y</i> + 6.`,
   `So (<i>x</i> − 3)(<i>y</i> − 2) = 6 + 6 = 12.`,
   `12 has 6 positive factors, giving 6 pairs with both brackets positive.`,
   `Negative pairs fail: <i>x</i> − 3 is at least −2, which forces <i>y</i> − 2 to be −6 or −12, making <i>y</i> negative.`,
   `So there are 6 pairs.`],
  `Add a constant to both sides so the left-hand side factorises.`);
LS('ineq', 'smc', 'Algebra', 3, 'Largest and smallest values', 'AM–GM and completing the square',
  [`Completing the square shows the smallest value of a quadratic at a glance.`,
   `AM–GM: for positive numbers, (<i>a</i> + <i>b</i>) ÷ 2 ≥ √(<i>ab</i>), with equality when <i>a</i> = <i>b</i>.`,
   `Fixed sum: the product is largest when the numbers are equal. Fixed product: the sum is smallest when they are equal.`,
   `“Maximise 3<i>x</i> + 4<i>y</i> on a circle” is a line just touching the circle.`],
  `The positive numbers <i>x</i> and <i>y</i> satisfy <i>xy</i> = 36. What is the smallest possible value of <i>x</i> + <i>y</i>?`,
  [`By AM–GM, (<i>x</i> + <i>y</i>) ÷ 2 ≥ √(<i>xy</i>).`,
   `√36 = 6, so <i>x</i> + <i>y</i> ≥ 12.`,
   `Equality needs <i>x</i> = <i>y</i>, which gives <i>x</i> = <i>y</i> = 6. That does satisfy <i>xy</i> = 36.`,
   `So the smallest value is 12.`],
  `Always check that the equality case can actually happen.`);

/* Follow-on */
LS('kang', 'fo', 'Kangaroo', 1, 'Kangaroo tactics', 'A different marking scheme, a different plan',
  [`Grey and Pink Kangaroo: 25 multiple-choice questions in an hour, 5 marks for Q1–15 and 6 for Q16–25.`,
   `There is no penalty for a wrong answer, so answer every question, even with a guess.`,
   `Senior Kangaroo has no options: each answer is a whole number from 1 to 999. A fraction or a negative answer means you have slipped.`,
   `Questions lean towards puzzles and counting. Small cases and patterns help.`],
  `What is the sum of all the two-digit multiples of 9?`,
  [`They run from 18 to 99.`,
   `18 = 9 × 2 and 99 = 9 × 11, so there are 10 of them.`,
   `For an evenly spaced list, sum = number of terms × (first + last) ÷ 2.`,
   `10 × (18 + 99) ÷ 2 = 585.`],
  `In a Kangaroo, never leave a blank.`);
LS('oly', 'fo', 'Olympiad', 2, 'Writing an Olympiad solution', 'Marks are for reasoning',
  [`Say what your letters mean before you use them.`,
   `Give a reason for every step and write in sentences.`,
   `Finish with a sentence that answers the question asked.`,
   `“Find all” needs two parts: show your answers work, and prove nothing else does.`,
   `Solutions are marked roughly as complete with slips, or as partial progress. A bare answer scores almost nothing.`],
  `Prove that the sum of any two odd numbers is even.`,
  [`Let the two odd numbers be 2<i>a</i> + 1 and 2<i>b</i> + 1, where <i>a</i> and <i>b</i> are integers.`,
   `Their sum is 2<i>a</i> + 2<i>b</i> + 2.`,
   `This equals 2(<i>a</i> + <i>b</i> + 1).`,
   `Since <i>a</i> + <i>b</i> + 1 is an integer, the sum is a multiple of 2. So the sum of any two odd numbers is even.`],
  `Checking a few examples is not a proof. Use letters so it covers every case.`);

/* GCSE Maths */
LS('gquad', 'gm', 'Algebra', 2, 'Solving quadratics', 'Factorise, or use the formula',
  [`Get everything on one side so the equation equals zero.`,
   `To factorise <i>x</i>² + <i>bx</i> + <i>c</i>, find two numbers that multiply to <i>c</i> and add to <i>b</i>.`,
   `If it will not factorise, use <i>x</i> = (−<i>b</i> ± √(<i>b</i>² − 4<i>ac</i>)) ÷ 2<i>a</i>.`,
   `A quadratic usually has two solutions. Give both.`],
  `Solve <i>x</i>² + 2<i>x</i> − 15 = 0.`,
  [`Find two numbers that multiply to −15 and add to 2: they are 5 and −3.`,
   `So (<i>x</i> + 5)(<i>x</i> − 3) = 0.`,
   `Either bracket can be zero.`,
   `<i>x</i> = −5 or <i>x</i> = 3.`],
  `The signs in the brackets are the opposite of the solutions.`);
LS('gtrig', 'gm', 'Geometry', 2, 'Right-angled trigonometry', 'SOH CAH TOA',
  [`Label the sides from the angle you are using: opposite, adjacent, hypotenuse.`,
   `sin = opposite ÷ hypotenuse, cos = adjacent ÷ hypotenuse, tan = opposite ÷ adjacent.`,
   `To find an angle, use the inverse function.`,
   `Learn the exact values for 30°, 45° and 60° for the non-calculator paper.`],
  `In a right-angled triangle, the side next to a 60° angle is 6 cm. How long is the hypotenuse?`,
  [`We have the adjacent side and want the hypotenuse, so use cos.`,
   `cos 60° = 6 ÷ hypotenuse.`,
   `cos 60° = ½, so the hypotenuse = 6 ÷ ½.`,
   `The hypotenuse is 12 cm.`],
  `Choose the ratio from the two sides involved.`);
LS('gcirc', 'gm', 'Geometry', 3, 'Circle theorems', 'Five facts and the right words',
  [`The angle at the centre is twice the angle at the circumference.`,
   `Angles in the same segment are equal.`,
   `The angle in a semicircle is 90°.`,
   `Opposite angles of a cyclic quadrilateral add to 180°.`,
   `A tangent meets the radius at 90°. Quote the theorem by name to earn the reasoning mark.`],
  `One angle of a cyclic quadrilateral is 110°. What is the size of the opposite angle?`,
  [`Opposite angles of a cyclic quadrilateral add to 180°.`,
   `So the opposite angle is 180° − 110°.`,
   `The answer is 70°.`],
  `Write the reason in words, not just the number.`);

/* A-level Maths */
LS('diff', 'am', 'Pure', 2, 'Differentiation', 'Gradients and stationary points',
  [`Power rule: <i>x</i><sup>n</sup> differentiates to <i>nx</i><sup>n−1</sup>.`,
   `Chain rule for a function of a function. Product rule for two functions multiplied.`,
   `Stationary points are where d<i>y</i>/d<i>x</i> = 0.`,
   `Second derivative positive means a minimum. Negative means a maximum.`],
  `Find the stationary points of <i>y</i> = <i>x</i>³ − 3<i>x</i> and say what kind each is.`,
  [`Differentiate: d<i>y</i>/d<i>x</i> = 3<i>x</i>² − 3.`,
   `Set it to zero: 3<i>x</i>² = 3, so <i>x</i> = 1 or <i>x</i> = −1.`,
   `Find <i>y</i>: at <i>x</i> = 1, <i>y</i> = −2. At <i>x</i> = −1, <i>y</i> = 2.`,
   `The second derivative is 6<i>x</i>: positive at <i>x</i> = 1 and negative at <i>x</i> = −1.`,
   `So (1, −2) is a minimum and (−1, 2) is a maximum.`],
  `Differentiate, set to zero, then classify.`);
LS('int', 'am', 'Pure', 2, 'Integration', 'Reverse the power rule',
  [`<i>x</i><sup>n</sup> integrates to <i>x</i><sup>n+1</sup> ÷ (<i>n</i> + 1), as long as <i>n</i> is not −1.`,
   `Indefinite integrals need + <i>c</i>.`,
   `For a definite integral, substitute the top limit, then subtract the bottom limit.`,
   `A definite integral gives the area between the curve and the <i>x</i>-axis (negative below the axis).`],
  `Evaluate the integral of 2<i>x</i> + 1 from <i>x</i> = 1 to <i>x</i> = 3.`,
  [`Integrate: <i>x</i>² + <i>x</i>.`,
   `At <i>x</i> = 3: 9 + 3 = 12.`,
   `At <i>x</i> = 1: 1 + 1 = 2.`,
   `Subtract: 12 − 2 = 10.`],
  `Top limit minus bottom limit, with brackets round each.`);

/* GCSE Science */
LS('eq', 'gs', 'Physics', 1, 'Using equations in physics', 'A routine that earns every mark',
  [`Write the equation first.`,
   `Convert units before substituting: minutes to seconds, km to m, g to kg.`,
   `Substitute the numbers, then rearrange if you need to.`,
   `Give the answer with its unit.`],
  `A 1500 W kettle is switched on for 2 minutes. How much energy does it transfer?`,
  [`Equation: energy = power × time.`,
   `Convert the time: 2 minutes = 120 s.`,
   `Substitute: 1500 × 120.`,
   `Energy = 180 000 J.`],
  `Most lost marks come from units, not from the equation.`);
LS('mol', 'gs', 'Chemistry', 2, 'Moles', 'One equation, used three ways',
  [`moles = mass ÷ relative formula mass.`,
   `Find the relative formula mass by adding the relative atomic masses of every atom in the formula.`,
   `Rearranged: mass = moles × relative formula mass.`,
   `For solutions: moles = concentration × volume in dm³.`],
  `What is the mass of 0.25 mol of carbon dioxide, CO₂? (C = 12, O = 16)`,
  [`Relative formula mass: 12 + 2 × 16 = 44.`,
   `mass = moles × relative formula mass.`,
   `0.25 × 44 = 11.`,
   `The mass is 11 g.`],
  `Always work out the formula mass before anything else.`);

/* A-level Science */
LS('ph', 'as', 'Chemistry', 2, 'pH calculations', 'Strong acids and strong bases',
  [`pH = −log₁₀[H⁺].`,
   `A strong acid ionises fully, so for HCl the hydrogen ion concentration equals the acid concentration.`,
   `For a strong base, find [OH⁻] first, then use <i>K</i><sub>w</sub> = [H⁺][OH⁻] = 1.0 × 10⁻¹⁴ at 298 K.`,
   `Give pH to two decimal places unless told otherwise.`],
  `What is the pH of 0.050 mol dm⁻³ sodium hydroxide at 298 K?`,
  [`NaOH is a strong base, so [OH⁻] = 0.050 mol dm⁻³.`,
   `[H⁺] = 1.0 × 10⁻¹⁴ ÷ 0.050 = 2.0 × 10⁻¹³ mol dm⁻³.`,
   `pH = −log₁₀(2.0 × 10⁻¹³).`,
   `pH = 12.70.`],
  `A base needs the extra step through K<sub>w</sub>.`);


// Diagrams, drawn from coordinates so the geometry is right.
const FIGS = (() => {
  const r1 = n => Math.round(n * 10) / 10;
  const S = (body, w = 220, h = 150) => `<svg class="fig" viewBox="0 0 ${w} ${h}" role="img" aria-label="Diagram for this question">${body}</svg>`;

/* ───────── Home ───────── */
function dailyQ() { const pool = QUESTIONS.filter(q => q.tr === S.track && q.o); return pool[Math.floor(seeded(dayKey() + S.track)() * pool.length)]; }
function weakest(tr) {
  const st = topicStats(tr); const tried = st.filter(s => s.n >= 2).sort((a, b) => a.c / a.n - b.c / b.n)[0];
  if (tried && tried.c / tried.n < 0.8) return { ...tried, why: `${Math.round(100 * tried.c / tried.n)}% correct so far` };
  const fresh = st.filter(s => s.done < s.total).sort((a, b) => a.done / a.total - b.done / b.total)[0];
  return fresh ? { ...fresh, why: `${fresh.total - fresh.done} questions still to get right` } : null;
}

    <div class="field"><span>What are you preparing for?</span><div class="pickgrid">${TRACKS.map(t => `<button class="pick ${t.id === S.track ? 'on' : ''}" data-act="track" data-id="${t.id}" aria-pressed="${t.id === S.track}"><b>${t.name}</b><small>${t.blurb}</small></button>`).join('')}</div></div>
    <div class="field"><span>How much each day?</span><div class="chips">${[[20, 'Light'], [30, 'Regular'], [50, 'Keen'], [80, 'Serious']].map(([g, n]) => `<button class="chip" aria-selected="${g === S.goal}" data-act="goal" data-v="${g}">${n} · ${g} XP</button>`).join('')}</div></div>

}

/* ───────── Practice ───────── */
function pick(tr, tp, n) {
  const pool = QUESTIONS.filter(q => q.tr === tr && (!tp || q.tp === tp));
  const cls = q => { const r = S.q[q.id]; return !r ? 0 : !r.last ? 1 : 2; };
  return shuffle(pool).sort((a, b) => cls(a) - cls(b) || (S.q[a.id] ? S.q[a.id].t : 0) - (S.q[b.id] ? S.q[b.id].t : 0)).slice(0, n).sort((a, b) => a.d - b.d);
}
function vPractice() {
  const tr = TR[S.track], st = topicStats(S.track), miss = mistakes(S.track).length;
  const all = st.reduce((a, s) => a + s.total, 0), done = st.reduce((a, s) => a + s.done, 0);
  return `
  <header class="page-head"><h1>Practice</h1><p class="muted">Instant feedback and a worked solution after every question.</p></header>
  ${trackChips()}
  <section class="card">
    <div class="row between"><div><h2>${tr.name}</h2><p class="muted">${tr.blurb}</p></div><span class="pill">${done} / ${all} mastered</span></div>
    ${bar(100 * done / all, 'big')}
    <div class="row gap wrap">
      <button class="btn primary" data-act="quick">Mixed practice</button>
      ${miss ? `<button class="btn" data-act="mistakes">Fix my mistakes (${miss})</button>` : ''}
    </div>
  </section>
  <h3 class="section">Topics</h3>
  <div class="list">${st.map(s => `
    <button class="rowbtn" data-act="topic" data-tp="${s.tp}">
      <span class="rowbtn-main"><b>${s.tp}</b><small>${s.done} of ${s.total} mastered${s.n ? ` · ${Math.round(100 * s.c / s.n)}% accuracy` : ''}</small>${bar(100 * s.done / s.total)}</span>
      <span class="rowbtn-go">${s.done === s.total ? I.check : I.arrow}</span>
    </button>`).join('')}</div>`;
}

const baseXP = q => [0, 10, 12, 15][q.d];
function startRun(qs, o = {}) {
  if (!qs.length) { toast('Nothing to practise here yet'); return; }
  RUN = Object.assign({ qs, i: 0, sel: null, ok: null, step: 1, hint: false, gain: 0, correct: 0, xp: 0, combo: 0, done: false, mult: 1, title: 'Practice', reveal: false }, o);
  go('run');
}
function finishAnswer(q, ok, gain) {
  record(q, ok); RUN.ok = ok; RUN.gain = gain; RUN.xp += gain; if (ok) RUN.correct++;
  addXP(gain); checkBadges(); save(); render();
  const fb = document.getElementById('fb'); if (fb) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function vRun() {
  if (RUN.done) return vRunDone();

  let body = '';
  if (k === 'mcq') body = `<div class="opts">${q.o.map((o, i) => {
    const st = !ans ? '' : i === q.a ? 'right' : i === RUN.sel ? 'wrong' : 'dim';
    return `<button class="opt ${st}" data-act="ans" data-i="${i}" ${ans ? 'disabled' : ''}><span class="loz">${LETTERS[i]}</span><span>${o}</span></button>`;
  }).join('')}</div>`;

/* ───────── Mocks ───────── */
const MOCKS = [
  { id: 'imc', tr: 'imc', n: 25, mins: 60, name: 'Intermediate full paper', d: [8, 9, 8] },
  { id: 'imc-mini', tr: 'imc', n: 10, mins: 24, name: 'Intermediate mini paper', d: [4, 3, 3] },
  { id: 'smc', tr: 'smc', n: 25, mins: 90, name: 'Senior full paper', d: [8, 9, 8] },
  { id: 'smc-mini', tr: 'smc', n: 10, mins: 36, name: 'Senior mini paper', d: [4, 3, 3] },
];
function schemeText(m) {
  if (m.tr === 'smc') return `Start on ${m.n} marks. Plus 4 for each correct answer, minus 1 for each wrong one, 0 for a blank.`;
  const a = Math.round(m.n * 0.6), b = Math.round(m.n * 0.8);
  return `Q1–${a}: 5 marks. Q${a + 1}–${b}: 6 marks, minus 1 if wrong. Q${b + 1}–${m.n}: 6 marks, minus 2 if wrong.`;
}
function buildMock(def) { let qs = []; [1, 2, 3].forEach((d, i) => { qs = qs.concat(shuffle(QUESTIONS.filter(q => q.tr === def.tr && q.o && q.d === d)).slice(0, def.d[i])); }); return qs; }

const MKEY = 'podium.mock';
function saveMock() {

    if (MOCK && !MOCK.done) localStorage.setItem(MKEY, JSON.stringify({ id: MOCK.def.id, q: MOCK.qs.map(q => q.id), ans: MOCK.ans, flag: MOCK.flag, i: MOCK.i, end: MOCK.end }));

}

    const def = MOCKS.find(m => m.id === r.id), qs = r.q.map(id => BYID[id]); if (!def || qs.some(q => !q)) return;

  } catch (e) { /* storage unavailable */ }
}
function startMock(id) {
  const def = MOCKS.find(m => m.id === id), qs = buildMock(def);

const fmt = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;

/* ───────── Number sprint ───────── */
const FR = [['1/8', '0.125'], ['3/8', '0.375'], ['5/8', '0.625'], ['7/8', '0.875'], ['1/6', '0.1666…'], ['1/7', '0.1428…'], ['1/9', '0.111…'], ['1/11', '0.0909…'], ['1/12', '0.0833…'], ['3/20', '0.15'], ['7/20', '0.35'], ['1/16', '0.0625']];
const PR = [53, 59, 61, 67, 71, 73, 79, 83, 89, 97, 101, 103, 107, 109, 113], NP = [51, 57, 63, 69, 77, 87, 91, 93, 111, 117, 119, 121, 133, 143];
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function genSprint() {
  const t = ri(0, 4); let q, a, o;
  const numOpts = (v, alts) => { const s = new Set([v]); for (const x of shuffle(alts)) { if (s.size < 4 && x > 0) s.add(x); } let k = 1; while (s.size < 4) s.add(v + 7 * k++); return shuffle([...s]).map(String); };
  if (t === 0) { const n = ri(11, 25); a = n * n; q = `${n}²`; o = numOpts(a, [a + n, a - n, a + 10, a - 10, (n + 1) * (n + 1), a + 20]); }
  else if (t === 1) { const p = Math.random() < 0.5, n = p ? PR[ri(0, PR.length - 1)] : NP[ri(0, NP.length - 1)]; q = `Is ${n} prime?`; a = p ? 'Prime' : 'Not prime'; o = ['Prime', 'Not prime']; }
  else if (t === 2) { const n = ri(5, 12); a = 2 ** n; q = `2<sup>${n}</sup>`; o = numOpts(a, [a * 2, a / 2, a + a / 4, a - a / 4, a + 2]); }
  else if (t === 3) { const f = FR[ri(0, FR.length - 1)]; q = `${f[0]} as a decimal`; a = f[1]; o = shuffle([a, ...shuffle(FR.filter(x => x[1] !== a)).slice(0, 3).map(x => x[1])]); }
  else { const x = [15, 25, 35, 45, 125, 11, 99][ri(0, 6)], y = x === 125 ? ri(2, 9) * 2 : ri(3, 12) * 2; a = x * y; q = `${x} × ${y}`; o = numOpts(a, [a + x, a - x, a + 10, a - 10, a + 2 * x, a + 20]); }
  return { q, a: String(a), o };
}
function startSprint() {
  SPRINT = { end: Date.now() + 60000, score: 0, wrong: 0, cur: genSprint(), done: false, flash: '' };
  go('sprint'); clearInterval(tickId);
  tickId = setInterval(() => {
    const left = Math.max(0, Math.ceil((SPRINT.end - Date.now()) / 1000)), el = document.getElementById('stime');
    if (el) el.textContent = left + 's';
    if (left <= 0) { clearInterval(tickId); SPRINT.done = true; const best = SPRINT.score > S.sprint; if (best) S.sprint = SPRINT.score; SPRINT.best = best; SPRINT.xp = SPRINT.score * 2; addXP(SPRINT.xp); checkBadges(); save(); render(); }
  }, 250);
}
function vSprint() {
  const P = SPRINT;
  if (P.done) return `<div class="run"><article class="qcard center"><span class="eyebrow">Number sprint</span><div class="bigscore">${P.score}</div><h1>${P.best ? 'New personal best.' : `Your best is ${S.sprint}.`}</h1><p class="muted">${P.wrong} wrong. +${P.xp} XP.</p><div class="row gap wrap centerrow"><button class="btn primary" data-act="sprint">Again</button><button class="btn" data-act="quit">Done</button></div></article></div>`;

    const H = SHEET, r = scoreMock(H.tr, H.m);
    if (r.b === 25) { toast('Mark at least one question first'); return; }
    S.mocks.push({ name: `Real ${H.tr === 'imc' ? 'Intermediate' : 'Senior'} paper${H.label ? ' ' + H.label.trim() : ''}`, tr: H.tr, date: dayKey(), score: r.score, max: r.max, c: r.c, w: r.w, b: r.b, band: band(H.tr, r.score, r.max) });
    if (S.mocks.length > 40) S.mocks.shift();
    addXP(30); checkBadges(); save(); SHEET = null; setRoute('mocks'); toast('Result saved. +30 XP', 'good');
  },
  backup: () => {
    BACKUP = true; render();
    const out = document.getElementById('backup-out'); if (out) { out.focus(); out.select(); }
    try { navigator.clipboard.writeText(encodeState()).then(() => toast('Backup code copied', 'good'), () => toast('Select the code and copy it')); } catch (e) { toast('Select the code and copy it'); }
  },
  restore: () => {
    const raw = (document.getElementById('restore-in').value || '').replace(/\s+/g, ''); let r = null;
    try { r = JSON.parse(decodeURIComponent(escape(atob(raw)))); } catch (e) { r = null; }
    if (!r || r.v !== 1 || typeof r.xp !== 'number') { toast('That code is not valid. Copy the whole code and try again.'); return; }
    S = Object.assign(blank(), r); BACKUP = false; save(); render(); toast('Progress restored', 'good');
  },
  reset: () => {
    if (!CONFIRM) { CONFIRM = true; render(); return; }
    CONFIRM = false; S = blank(); save(); toast('Progress erased'); render();
  },
};
document.addEventListener('click', e => {
  const link = e.target.closest('a[href^="#"]');
  if (link) { e.preventDefault(); setRoute(link.getAttribute('href').slice(1)); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.dataset.act !== 'reset') CONFIRM = false;
  if (!['backup', 'restore'].includes(b.dataset.act)) BACKUP = false;
  const f = ACT[b.dataset.act]; if (!f) return;
  try { f(b.dataset, b); } catch (err) { toast('Something went wrong. Try that again.'); try { console.error(err); } catch (e2) { /* ignore */ } }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.dataset.form !== 'num' || RUN.ok !== null) return;
  const raw = document.getElementById('numin').value.trim(); if (!/^\d+$/.test(raw)) { toast('Type a whole number'); return; }
  const q = RUN.qs[RUN.i], v = parseInt(raw, 10), ok = v === q.a; RUN.sel = v; RUN.combo = ok ? RUN.combo + 1 : 0;
  finishAnswer(q, ok, ok ? baseXP(q) + 3 : 0);
});
document.addEventListener('input', e => {
  if (e.target.id === 'sheet-label' && SHEET) SHEET.label = e.target.value;
  if (e.target.id === 'set-name') S.name = e.target.value.trim().slice(0, 24);
  if (e.target.id === 'facts-q') { FACTQ = e.target.value; const out = document.getElementById('facts-out'); if (out) out.innerHTML = factsHtml(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'set-exam') { S.exam = e.target.value; save(); toast(S.exam ? 'Paper date saved' : 'Paper date cleared'); }
  if (e.target.id === 'set-name') { S.name = e.target.value.trim().slice(0, 24); save(); const me = document.getElementById('me-btn'); if (me) me.textContent = (S.name || cloudName || '?').charAt(0).toUpperCase(); }
  if (e.target.id === 'set-goal') { S.goal = +e.target.value; save(); render(); }
});

/* ───────── Optional account sync ───────── */
let cloudDoc = null, cloudOn = false, cloudBusy = false, cloudDirty = false, cloudTimer = 0;
async function cloudInit() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    cloudDoc = db.doc('data/users/' + id + '/progress');
    const snap = await cloudDoc.get(); let remote = null;
    if (snap.exists) { try { remote = JSON.parse(snap.data().json); } catch (e) { remote = null; } }
    cloudOn = true;
    try { const ps = await user.profiles([id]); cloudName = (ps && ps[id] && ps[id].name) || ''; } catch (e) { cloudName = ''; }
    if (remote && remote.v === 1 && (remote.updated || 0) > (S.updated || 0)) { S = Object.assign(blank(), remote); persistLocal(); if (!MODE) render(); }
    else if (S.updated && (!remote || (remote.updated || 0) < S.updated)) cloudPush();
    if (!MODE) render();
  } catch (e) { cloudDoc = null; cloudOn = false; }
}
function cloudPush() { if (!cloudDoc) return; cloudDirty = true; clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudFlush, 2500); }
async function cloudFlush() {
  if (cloudBusy || !cloudDirty || !cloudDoc) return;
  cloudBusy = true; cloudDirty = false;
  try { await cloudDoc.set({ json: JSON.stringify(S), updated: S.updated }); }
  catch (e) { if (e && e.code !== 'unavailable') { cloudDoc = null; cloudOn = false; } }
  cloudBusy = false; if (cloudDirty) cloudPush();
}

if (typeof document !== 'undefined' && app) { loadMock(); render(); cloudInit(); }


</script>
<script>
window.OFFLINE_CAPABLE = 'serviceWorker' in navigator && /^https?:$/.test(location.protocol);
if (window.OFFLINE_CAPABLE) {
  navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function () {
    return caches.match('./').then(function (hit) {
      if (!hit) return;
      window.OFFLINE_READY = true;
      var first = false; try { first = !localStorage.getItem('podium.offline'); localStorage.setItem('podium.offline', '1'); } catch (e) {}
      if (first) toast('Ready to use offline', 'good');
      if (!MODE && route() === 'account') render();
    });
  }).catch(function () {});
}
</script>
